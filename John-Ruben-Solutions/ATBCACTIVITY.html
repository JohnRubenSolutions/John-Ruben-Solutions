                            <button onClick={() => setShowManual(false)} className="absolute top-3 right-3 muted" aria-label="Close"><Icon n="x" /></button>
                            <h3 className="font-bold mb-3">Add a custom food</h3>
                            <form onSubmit={submitManual} className="grid grid-cols-2 md:grid-cols-4 gap-2">
                                <input className="field col-span-2 md:col-span-4" placeholder="Food name" required value={manualForm.name} onChange={e => setManualForm({ ...manualForm, name: e.target.value })} />
                                <input type="number" step="any" inputMode="decimal" className="field" placeholder="Protein (g)" required value={manualForm.p} onChange={e => setManualForm({ ...manualForm, p: e.target.value })} />
                                <input type="number" step="any" inputMode="decimal" className="field" placeholder="Carbs (g)" required value={manualForm.c} onChange={e => setManualForm({ ...manualForm, c: e.target.value })} />
                                <input type="number" step="any" inputMode="decimal" className="field" placeholder="Fat (g)" required value={manualForm.f} onChange={e => setManualForm({ ...manualForm, f: e.target.value })} />
                                <input type="number" step="any" inputMode="decimal" className="field" placeholder="Fiber (g)" value={manualForm.fib} onChange={e => setManualForm({ ...manualForm, fib: e.target.value })} />
                                <button type="submit" className="btn btn-lime col-span-2 md:col-span-4">Add to log</button>
                            </form>
                            <p className="text-[11px] muted mt-2">Calories are calculated from macros (4/4/9 kcal per gram).</p>
                        </div>
                    )}

                    {results.length > 0 && (
                        <div className="card mb-4 overflow-hidden" style={{ maxHeight: 260, overflowY: 'auto' }}>
                            {results.map(f => <button key={f.fdcId} onClick={() => selectFood(f)} className="block w-full text-left p-3 text-sm hover:bg-white/5" style={{ borderBottom: '1px solid var(--line)' }}>{f.description}</button>)}
                        </div>
                    )}

                    {selectedFood && (
                        <div className="card p-5 mb-4 pop relative" style={{ borderColor: 'var(--lime)' }}>
                            <button onClick={() => setSelectedFood(null)} className="absolute top-4 right-4 muted" aria-label="Close"><Icon n="x" /></button>
                            <p className="font-bold mb-4 pr-10 leading-snug">{selectedFood.name}</p>
                            <div className="inset flex items-center justify-between p-2 mb-3">
                                <div className="flex items-center gap-2">
                                    <input type="number" inputMode="decimal" value={displayAmount} onFocus={() => setDisplayAmount('')} onChange={e => setDisplayAmount(e.target.value)} className="w-20 bg-transparent font-bold text-2xl text-center outline-none" placeholder="0" aria-label="Amount" />
                                    <button onClick={() => setMeasureUnit(measureUnit === 'g' ? 'oz' : 'g')} className="chip" style={{ background: 'transparent', border: '1px solid var(--lime)', color: 'var(--lime)' }}>{measureUnit}</button>
                                </div>
                                <div className="text-right pr-1">
                                    <span className="block text-2xl font-bold leading-none">{Math.round(selectedFood.calories * currentRatio || 0)}</span>
                                    <span className="text-[11px] muted">kcal</span>
                                </div>
                            </div>
                            <div className="flex gap-2 mb-4">
                                {(measureUnit === 'g' ? [50, 100, 150, 200] : [1, 2, 4, 8]).map(a => (
                                    <button key={a} onClick={() => setDisplayAmount(a)} className="chip">{a} {measureUnit}</button>
                                ))}
                            </div>
                            <div className="grid grid-cols-4 gap-2 mb-4 text-center text-xs">
                                {[['Protein', 'var(--teal)', selectedFood.protein], ['Carbs', 'var(--lime)', selectedFood.carbs], ['Fat', 'var(--amber)', selectedFood.fat], ['Fiber', 'var(--violet)', selectedFood.fiber]].map(([l, c, v]) => (
                                    <div key={l} className="inset p-2"><span className="font-bold block mb-1" style={{ color: c }}>{l}</span>{(v * currentRatio).toFixed(1)}g</div>
                                ))}
                            </div>
                            <button onClick={addToLog} className="btn btn-lime w-full py-3.5">Add to daily log</button>
                        </div>
                    )}

                    <div className="space-y-2">
                        {nutritionLog.length === 0 && (
                            <div className="card p-6 text-center text-sm muted">Nothing logged for this day. Search a food, scan a barcode, or add a custom entry.</div>
                        )}
                        {nutritionLog.map(item => (
                            <div key={item.id} className="card p-3">
                                <div className="flex items-start justify-between gap-2">
                                    <div className="min-w-0">
                                        <div className="font-bold text-sm truncate">{item.name}</div>
                                        <div className="text-[11px] muted">{item.grams > 0 ? `${Math.round(item.grams)} g` : 'Custom entry'}{item.time ? ` - ${item.time}` : ''}</div>
                                    </div>
                                    <div className="flex items-center gap-1 shrink-0">
                                        <span className="font-extrabold mr-1">{Math.round(item.calories)}<span className="text-[11px] muted font-medium"> kcal</span></span>
                                        {item.grams > 0 && <button onClick={() => editLog(item)} className="p-1.5 muted hover:text-white" aria-label={`Edit amount of ${item.name}`}><Icon n="edit" size={16} /></button>}
                                        <button onClick={() => deleteLog(item)} className="p-1.5 hover:text-white" style={{ color: 'var(--red)' }} aria-label={`Remove ${item.name}`}><Icon n="x" size={16} /></button>
                                    </div>
                                </div>
                                <div className="flex gap-3 mt-2 text-[11px] font-bold">
                                    <span style={{ color: 'var(--teal)' }}>P {(item.protein || 0).toFixed(1)}</span>
                                    <span style={{ color: 'var(--lime)' }}>C {(item.carbs || 0).toFixed(1)}</span>
                                    <span style={{ color: 'var(--amber)' }}>F {(item.fat || 0).toFixed(1)}</span>
                                    <span style={{ color: 'var(--violet)' }}>Fib {(item.fiber || 0).toFixed(1)}</span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            const filteredLib = Object.entries(WORKOUT_LIBRARY).map(([g, list]) => [g, list.filter(e => e.toLowerCase().includes(libQuery.toLowerCase()))]).filter(([, l]) => l.length);
            const renderTrain = () => {
                return (
                    <div className="pop">
                        <div className="card p-5 mb-4 flex items-center justify-between">
                            <div>
                                <div className="text-sm font-bold">Training volume today</div>
                                <div className="text-xs muted">Sets x reps x weight</div>
                            </div>
                            <div className="text-right"><span className="text-3xl font-extrabold">{totalVolume.toLocaleString()}</span><span className="ml-1 text-xs font-bold" style={{ color: 'var(--teal)' }}>lbs</span></div>
                        </div>

                        <div className="card p-4 mb-4">
                            <div className="flex items-baseline justify-between mb-3">
                                <div className="text-sm font-bold">Sets in the last 7 days</div>
                                <div className="text-[11px] muted">Marker = 10 sets</div>
                            </div>
                            <div className="space-y-2">
                                {MUSCLE_GROUPS.map(g => {
                                    const n = weeklySets[g]; const pct = Math.min(100, n / 20 * 100);
                                    return (
                                        <div key={g} className="flex items-center gap-3 text-xs">
                                            <span className="w-16 muted">{g}</span>
                                            <div className="flex-1 h-2 rounded-full relative" style={{ background: 'var(--s3)' }}>
                                                <div className="h-2 rounded-full" style={{ width: pct + '%', background: n >= 10 ? 'var(--teal)' : 'rgba(34,211,238,.45)', transition: 'width .4s' }}></div>
                                                <div className="absolute top-[-3px] h-[14px] w-px" style={{ left: '50%', background: 'var(--mut)' }}></div>
                                            </div>
                                            <span className="w-6 text-right font-bold">{n}</span>
                                        </div>
                                    );
                                })}
                            </div>
                            <p className="text-[11px] muted mt-3 leading-relaxed">Meta-analytic evidence links 10 or more weekly sets per muscle with more growth than fewer. See the Science tab.</p>
                        </div>

                        <Timer />

                        <div className="flex gap-2 mb-4">
                            <button onClick={() => setShowLibrary(true)} className="btn btn-ghost flex-1 flex items-center justify-center gap-2" style={{ borderStyle: 'dashed' }}><Icon n="plus" size={18} /> Add exercise</button>
                            {activeRoutine.length === 0 && <button onClick={repeatLastWorkout} className="btn btn-ghost">Repeat last workout</button>}
                        </div>

                        <div className="space-y-4">
                            {activeRoutine.map((ex, i) => {
                                const exLogs = workoutLogs.filter(l => l.exercise === ex.name);
                                const maxLogged = exLogs.reduce((m, l) => Math.max(m, (l.setIndex ?? -1) + 1), 0);
                                const setCount = Math.max(3, maxLogged) + (customSets[ex.name] || 0);
                                const hist = history.h[ex.name];
                                const group = EX_GROUP[ex.name] || ex.group || '';
                                const e1 = history.best[ex.name];
                                return (
                                    <div key={ex.name + i} className="card p-4 pop">
                                        <div className="flex justify-between items-start mb-3">
                                            <div>
                                                <h3 className="font-extrabold text-sm">{ex.name}</h3>
                                                <div className="text-[11px] muted mt-0.5">{group}{e1 ? `${group ? ' - ' : ''}best est. 1RM ${Math.round(e1)} lbs` : ''}</div>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => setCustomSets(p => ({ ...p, [ex.name]: (p[ex.name] || 0) + 1 }))} className="btn btn-ghost" style={{ padding: '.3rem .7rem', fontSize: '.75rem' }}>+ Set</button>
                                                <button onClick={() => removeExercise(i)} className="btn btn-danger" style={{ padding: '.3rem .7rem', fontSize: '.75rem' }}>Remove</button>
                                            </div>
                                        </div>
                                        <div className="space-y-2">
                                            {[...Array(setCount)].map((_, s) => (
                                                <SetRow key={s} idx={s}
                                                    existing={exLogs.find(l => l.setIndex === s)}
                                                    last={hist ? (hist.sets[s] || null) : null}
                                                    onSave={(idx, reps, wt) => saveEntry(ex.name, ex.group || EX_GROUP[ex.name] || '', idx, reps, wt)}
                                                    onClear={(idx) => clearEntry(ex.name, idx)} />
                                            ))}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                        {activeRoutine.length === 0 && <div className="card p-6 text-center text-sm muted mt-2">No exercises yet. Add one from the library or repeat your last workout.</div>}
                    </div>
                );
            };

            const toneColor = { ok: 'var(--lime)', warn: 'var(--amber)', info: 'var(--teal)' };
            const renderTrends = () => (
                <div className="pop space-y-4">
                    <div className="grid grid-cols-3 gap-3 text-center">
                        <div className="card p-4"><div className="text-3xl font-extrabold" style={{ color: 'var(--teal)' }}>{trends.adherence}%</div><div className="text-[11px] muted mt-1">Calorie adherence</div></div>
                        <div className="card p-4"><div className="text-3xl font-extrabold" style={{ color: 'var(--violet)' }}>{trends.proteinPct}%</div><div className="text-[11px] muted mt-1">Protein days hit</div></div>
                        <div className="card p-4"><div className="text-3xl font-extrabold" style={{ color: 'var(--lime)' }}>{trends.streak}<span className="text-sm"> d</span></div><div className="text-[11px] muted mt-1">Current streak</div></div>
                    </div>
                    <p className="text-[11px] muted -mt-2 px-1">Adherence counts days within 10% of your calorie target. Protein days hit counts days at 90% of target or more. Streak counts consecutive days with food or training logged.</p>

                    {rateAdvice && (
                        <div className="card p-4" style={{ borderColor: toneColor[rateAdvice.tone] }}>
                            <div className="flex items-center justify-between mb-1">
                                <div className="font-bold text-sm" style={{ color: toneColor[rateAdvice.tone] }}>{rateAdvice.head}</div>
                                <button onClick={() => setTab('science')} className="chip">Evidence</button>
                            </div>
                            <p className="text-xs leading-relaxed muted">{rateAdvice.body}</p>
                            <p className="text-[11px] muted mt-2">Compares your last 7 days of weigh-ins with the 7 days before.</p>
                        </div>
                    )}
                    {!rateAdvice && (
                        <div className="card p-4 text-xs muted leading-relaxed">Log at least 3 weigh-ins in each of the last two weeks to see your weekly rate of change and guidance.</div>
                    )}

                    <div className="seg">
                        <button className={chartMode === 'weekly' ? 'on' : ''} onClick={() => setChartMode('weekly')}>Weekly averages</button>
                        <button className={chartMode === 'daily' ? 'on' : ''} onClick={() => setChartMode('daily')}>Daily, 60 days</button>
                    </div>
                    <div className="card p-4 relative" style={{ height: 340 }}>
                        {isChartLoading && <div className="absolute inset-0 z-10 flex items-center justify-center font-bold rounded-2xl" style={{ background: 'rgba(17,26,44,.85)', color: 'var(--lime)' }}>Loading analytics...</div>}
                        <canvas ref={chartRef} id="trendChart"></canvas>
                    </div>
                    {!trends.hasData && !isChartLoading && <div className="card p-6 text-center text-sm muted">Your trends appear here once you have logged food, workouts or weight.</div>}
                </div>
            );

            const renderScience = () => (
                <div className="pop space-y-3">
                    <div className="card p-4">
                        <h2 className="font-bold mb-2">How this app uses research</h2>
                        <p className="text-xs muted leading-relaxed">Every target and tip in this app traces to the sources below. Diet and lifting trials usually cannot be double-blinded, because participants know what they eat and lift. Where a trial used blinding it is stated; otherwise it is described as open-label. Items with no randomized trial are marked as such instead of being dressed up.</p>
                        <div className="mt-3 space-y-1.5">
                            {Object.entries(GRADES).map(([k, g]) => (
                                <div key={k} className="flex gap-2 text-[11px] leading-relaxed"><span className="font-extrabold w-4" style={{ color: g.color }}>{k}</span><span className="muted"><strong className="text-white">{g.name}.</strong> {g.text}</span></div>
                            ))}
                        </div>
                    </div>

                    {EVIDENCE.map(ev => (
                        <details key={ev.id} className="card p-4">
                            <summary className="flex items-start gap-3">
                                <span className="chev mt-1 muted"><Icon n="chev" size={16} /></span>
                                <div className="flex-1">
                                    <div className="flex items-center gap-2 flex-wrap"><span className="font-bold text-sm">{ev.title}</span><GradeBadge g={ev.grade} /></div>
                                    <div className="text-[11px] muted mt-1">Used for: {ev.usedIn}</div>
                                </div>
                            </summary>
                            <div className="mt-3 pl-7 space-y-3">
                                <p className="text-xs leading-relaxed">{ev.summary}</p>
                                {ev.studies.map((s, i) => (
                                    <div key={i} className="inset p-3 text-xs leading-relaxed">
                                        <div className="font-bold">{s.cite}</div>
                                        <div className="muted mt-1"><strong className="text-white">Design:</strong> {s.design}</div>
                                        <div className="muted mt-1"><strong className="text-white">Finding:</strong> {s.finding}</div>
                                    </div>
                                ))}
                                <p className="text-[11px] leading-relaxed" style={{ color: 'var(--amber)' }}><strong>Limits:</strong> {ev.caveat}</p>
                            </div>
                        </details>
                    ))}

                    <div className="card p-4">
                        <h3 className="font-bold text-sm mb-2">Safety and scope</h3>
                        <p className="text-xs muted leading-relaxed">This app gives general wellness estimates and is not medical advice. Talk to a clinician before using calorie targets if you are under 18, pregnant or breastfeeding, have diabetes or take glucose-lowering medicine, have kidney disease, or have a history of disordered eating. If tracking food or weight increases anxiety or restriction, stop and seek support.</p>
                    </div>
                </div>
            );

            const f = (k, v) => { setForm(prev => ({ ...prev, [k]: v })); setFormDirty(true); };
            const goalOptions = [['-750', 'Lose, steady (-750 kcal)'], ['-500', 'Lose, moderate (-500 kcal)'], ['-250', 'Lose, gentle (-250 kcal)'], ['0', 'Maintain'], ['250', 'Gain, lean (+250 kcal)'], ['500', 'Gain, faster (+500 kcal)']];
            const activityOptions = [['1.2', 'Sedentary, desk job, little exercise'], ['1.375', 'Light, exercise 1-3 days/week'], ['1.55', 'Moderate, exercise 3-5 days/week'], ['1.725', 'High, exercise 6-7 days/week'], ['1.9', 'Very high, physical job plus training']];
            const renderYou = () => (
                <div className="pop space-y-4">
                    <div className="card p-5">
                        <h2 className="font-bold mb-4">Profile and goal</h2>
                        <div className="grid grid-cols-2 gap-3">
                            <label className="text-xs muted">Height
                                <div className="flex gap-2 mt-1">
                                    <input type="number" inputMode="decimal" className="field" value={form.height} onChange={e => f('height', e.target.value)} placeholder={form.heightUnit === 'in' ? '70' : '178'} />
                                    <select className="field" style={{ width: 80 }} value={form.heightUnit} onChange={e => f('heightUnit', e.target.value)}><option value="in">in</option><option value="cm">cm</option></select>
                                </div>
                            </label>
                            <label className="text-xs muted">Age
                                <input type="number" inputMode="numeric" className="field mt-1" value={form.age} onChange={e => f('age', e.target.value)} placeholder="30" />
                            </label>
                            <label className="text-xs muted col-span-2">Sex used in the energy equation
                                <select className="field mt-1" value={form.gender} onChange={e => f('gender', e.target.value)}><option value="male">Male</option><option value="female">Female</option></select>
                            </label>
                            <label className="text-xs muted col-span-2">Activity
                                <select className="field mt-1" value={form.activity} onChange={e => f('activity', e.target.value)}>{activityOptions.map(([v, l]) => <option key={v} value={v}>{l}</option>)}</select>
                            </label>
                            <label className="text-xs muted col-span-2">Goal
                                <select className="field mt-1" value={form.goal} onChange={e => f('goal', e.target.value)}>{goalOptions.map(([v, l]) => <option key={v} value={v}>{l}</option>)}</select>
                            </label>
                            <label className="text-xs muted">Protein (g per kg)
                                <input type="number" step="0.1" min="1.6" max="2.4" inputMode="decimal" className="field mt-1" value={form.proteinPerKg} onChange={e => f('proteinPerKg', e.target.value)} />
                            </label>
                            <label className="text-xs muted">Fat (% of calories)
                                <input type="number" step="1" min="20" max="40" inputMode="numeric" className="field mt-1" value={form.fatPct} onChange={e => f('fatPct', e.target.value)} />
                            </label>
                        </div>
                        <p className="text-[11px] muted mt-3 leading-relaxed">Protein stays between 1.6 and 2.4 g/kg and fat between 20% and 40%. Carbs fill the rest. Your weight comes from the daily weight box.</p>
                        <button onClick={saveProfile} disabled={!formDirty && !!profile} className="btn btn-lime w-full mt-4" style={{ opacity: (!formDirty && profile) ? .5 : 1 }}>Save profile</button>
                    </div>

                    <div className="card p-5">
                        <h2 className="font-bold mb-3">Your targets</h2>
                        {!formCalc ? <p className="text-xs muted">Enter a weight for today to see your targets.</p> : (
                            <div className="text-xs space-y-2">
                                <div className="flex justify-between"><span className="muted">Resting energy (Mifflin-St Jeor)</span><b>{formCalc.bmr.toLocaleString()} kcal</b></div>
                                <div className="flex justify-between"><span className="muted">Maintenance estimate</span><b>{formCalc.tdee.toLocaleString()} kcal</b></div>
                                <div className="flex justify-between"><span className="muted">Goal adjustment</span><b>{formCalc.delta > 0 ? '+' : ''}{formCalc.delta} kcal</b></div>
                                <div className="flex justify-between text-sm pt-2" style={{ borderTop: '1px solid var(--line)' }}><span className="font-bold">Daily target</span><b style={{ color: 'var(--lime)' }}>{formCalc.targets.calories.toLocaleString()} kcal</b></div>
                                <div className="grid grid-cols-4 gap-2 text-center pt-1">
                                    {[['Protein', formCalc.targets.protein, 'var(--teal)'], ['Carbs', formCalc.targets.carbs, 'var(--lime)'], ['Fat', formCalc.targets.fat, 'var(--amber)'], ['Fiber', formCalc.targets.fiber, 'var(--violet)']].map(([l, v, c]) => (
                                        <div key={l} className="inset p-2"><div className="font-bold" style={{ color: c }}>{l}</div><div className="font-extrabold text-sm">{v} g</div></div>
                                    ))}
                                </div>
                                {formCalc.delta !== 0 && (
                                    <p className="muted leading-relaxed pt-1">Projected change is roughly {(formCalc.delta * 7 / 3500).toFixed(1)} lb per week at first. It usually slows over time, so trust your measured trend over this estimate.</p>
                                )}
                                {formCalc.flags.map((fl, i) => <p key={i} style={{ color: 'var(--amber)' }}>{fl}</p>)}
                            </div>
                        )}
                        <button onClick={() => setTab('science')} className="chip mt-3">See the evidence</button>
                    </div>

                    <div className="card p-5">
                        <h2 className="font-bold mb-3">Your data</h2>
                        <button onClick={exportMasterReport} className="btn btn-lime w-full">Download master report (PDF)</button>
                        <p className="text-[11px] muted mt-2 leading-relaxed">Includes every logged day with body weight and training volume, plus weekly averages.</p>
                        <div className="text-xs muted mt-4 truncate">Signed in as {user.email || 'your account'}</div>
                        <button onClick={() => window.fb.signOut(window.fb.auth)} className="btn btn-danger w-full mt-3">Sign out</button>
                    </div>
                </div>
            );

            const tabs = [['food', 'Food', 'food'], ['train', 'Train', 'train'], ['trends', 'Trends', 'trends'], ['science', 'Science', 'science'], ['you', 'You', 'you']];

            return (
                <div className="max-w-2xl mx-auto px-4 pb-28 text-white">
                    {renderHeader()}
                    <div className="mt-3">
                        {tab === 'food' && renderFood()}
                        {tab === 'train' && renderTrain()}
                        {tab === 'trends' && renderTrends()}
                        {tab === 'science' && renderScience()}
                        {tab === 'you' && renderYou()}
                    </div>

                    {showLibrary && (
                        <div className="fixed inset-0 z-[70] p-4 overflow-y-auto" style={{ background: 'rgba(5,9,18,.94)' }} onClick={(e) => { if (e.target === e.currentTarget) setShowLibrary(false); }}>
                            <div className="max-w-md mx-auto card p-5 pop" style={{ boxShadow: '0 20px 60px rgba(0,0,0,.5)' }}>
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-lg font-bold">Exercise library</h2>
                                    <button onClick={() => setShowLibrary(false)} className="muted hover:text-white" aria-label="Close"><Icon n="x" size={22} /></button>
                                </div>
                                <input type="search" className="field mb-4" placeholder="Search exercises" value={libQuery} onChange={e => setLibQuery(e.target.value)} />
                                {filteredLib.map(([cat, list]) => (
                                    <div key={cat} className="mb-5">
                                        <h4 className="text-xs font-bold mb-2" style={{ color: 'var(--teal)' }}>{cat}</h4>
                                        <div className="grid gap-2">
                                            {list.map(ex => (
                                                <button key={ex} onClick={() => addExerciseToRoutine(ex)} className="w-full text-left p-3 inset text-sm font-bold hover:bg-white/10">{ex}</button>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                                {filteredLib.length === 0 && <p className="text-xs muted mb-4">No match. Add it as a custom exercise below.</p>}
                                <div className="pt-4" style={{ borderTop: '1px solid var(--line)' }}>
                                    <h4 className="text-xs font-bold mb-2">Custom exercise</h4>
                                    <div className="flex gap-2">
                                        <input className="field" placeholder="Name" value={customEx.name} onChange={e => setCustomEx({ ...customEx, name: e.target.value })} />
                                        <select className="field" style={{ width: 120 }} value={customEx.group} onChange={e => setCustomEx({ ...customEx, group: e.target.value })}>{MUSCLE_GROUPS.concat(['Cardio/Other']).map(g => <option key={g}>{g}</option>)}</select>
                                    </div>
                                    <button onClick={() => { if (customEx.name.trim()) { addExerciseToRoutine(customEx.name.trim(), customEx.group); setCustomEx({ name: "", group: "Chest" }); } }} className="btn btn-teal w-full mt-2">Add custom exercise</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {isScanning && (
                        <div className="fixed inset-0 z-[60] flex flex-col items-center justify-center p-4" style={{ background: 'rgba(5,9,18,.96)' }}>
                            <div className="card p-6 w-full max-w-sm">
                                <h3 className="text-center font-bold mb-4">Scan a barcode</h3>
                                <div id="reader" className="w-full overflow-hidden aspect-square rounded-2xl" style={{ border: '2px solid var(--line)' }}></div>
                                <button onClick={() => setIsScanning(false)} className="btn btn-danger w-full mt-5">Cancel</button>
                            </div>
                        </div>
                    )}

                    {toast && (
                        <div role="status" className="fixed left-1/2 -translate-x-1/2 z-[90] px-4 py-3 rounded-xl text-sm font-bold pop" style={{ bottom: 92, background: 'var(--s3)', border: '1px solid var(--line)', maxWidth: '90%' }}>{toast}</div>
                    )}

                    <nav className="tabbar fixed bottom-0 left-0 right-0 z-40" aria-label="Main">
                        <div className="max-w-2xl mx-auto flex">
                            {tabs.map(([id, label, icon]) => (
                                <button key={id} onClick={() => setTab(id)} className={`tab ${tab === id ? 'on' : ''} ${id === 'train' ? 'train' : ''}`} aria-current={tab === id ? 'page' : undefined}>
                                    <Icon n={icon} size={22} />{label}
                                </button>
                            ))}
                        </div>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
