    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const API_KEY = '4FRpc4urF9W2UedPH6agara8y52PR0efkZRmoPvv';

        /* ---------- site settings (edit these) ---------- */

        const LINKS = {
            protocols: 'https://johnrubensolutions.github.io/John-Ruben-Solutions/John-Ruben-Solutions/learn-more.html',
            about: 'https://www.johnrubensolutions.com/about-me',

        const WORKOUT_LIBRARY = {
            "Chest": ["Bench Press", "Incline DB Press", "Cable Flyes", "Pushups", "Dips"],
            "Back": ["Pull Ups", "Lat Pulldowns", "Bent Over Rows", "Deadlifts", "Face Pulls", "Stability Ball Hyperextension"],
            "Shoulders": ["Overhead Press", "Dumbbell Front Raise", "Dumbbell Lateral Raise", "Rear Delt Flyes"],
            "Arms": ["Dumbbell Bicep Curl", "Hammer Curls", "Cable Tricep Pushdown", "Skull Crushers"],
            "Legs": ["Squats", "Leg Press", "Leg Extensions", "Hamstring Curls", "Calf Raises", "Hip Bridge Thrusts", "Side Leg Raises", "Standing Hip Adduction", "Air Squats"],
            "Core": ["Exercise Ball Crunch", "Plank", "Leg Raises", "Russian Twists"],
            "Cardio/Other": ["Running", "Jog in place", "Cycling", "Swimming"]
        };
        const EX_GROUP = {};
        Object.entries(WORKOUT_LIBRARY).forEach(([g, list]) => list.forEach(e => { EX_GROUP[e] = g; }));
        const MUSCLE_GROUPS = ["Chest", "Back", "Shoulders", "Arms", "Legs", "Core"];

        /* ---------- helpers ---------- */
        const pad = n => String(n).padStart(2, '0');
        const localISO = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12, 0, 0); };
        const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return localISO(d); };
        const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
        const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
        const avg = arr => arr.reduce((a, b) => a + b, 0) / arr.length;

        const getWeekNumber = (d) => {
            const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
            const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
            return `${date.getUTCFullYear()}-W${Math.ceil((((date - yearStart) / 86400000) + 1) / 7)}`;
        };
        const formatWeekLabel = (weekStr) => {
            const parts = weekStr.split('-');
            return `Week ${parts[1].replace('W', '')}, ${parts[0]}`;
        };

        /* ---------- evidence-based target calculator ---------- */
        // Sources for every rule below are listed in the Science tab (EVIDENCE).
        const computeTargets = (p, weightLb) => {
            const flags = [];
            const kg = weightLb * 0.453592;
            const hRaw = num(p.height);
            const unit = p.heightUnit || (hRaw > 100 ? 'cm' : 'in');
            const heightCm = hRaw ? (unit === 'cm' ? hRaw : hRaw * 2.54) : 175;
            const age = num(p.age) || 30;
            const male = (p.gender || 'male') === 'male';
            const activity = num(p.activity) || 1.55;
            const goalParsed = parseFloat(p.goal);
            const goal = isNaN(goalParsed) ? -500 : goalParsed;

            if (num(p.age) > 0 && num(p.age) < 18) flags.push('These targets use adult equations and guidelines. Under 18, ask a pediatric clinician before using them.');

            // Mifflin-St Jeor resting energy x activity factor
            const bmr = 10 * kg + 6.25 * heightCm - 5 * age + (male ? 5 : -161);
            const tdee = Math.round(bmr * activity);

            let delta = goal;
            if (delta < 0) {
                const cap = Math.round(tdee * 0.25);
                if (-delta > cap) { delta = -cap; flags.push(`Deficit limited to 25% of maintenance (${cap} kcal) to keep weight loss gradual.`); }
                else if (-delta > 750) flags.push('A deficit above 750 kcal/day is more aggressive than guideline-based advice (500-750). Watch your weekly rate on the Trends tab.');
            }
            let cals = tdee + delta;
            const floor = male ? 1500 : 1200;
            if (cals < floor) { cals = floor; flags.push(`Calories raised to the ${floor} kcal/day minimum used in clinical guidelines. Intakes below ~800 kcal/day need medical supervision.`); }

            // Protein: g per kg body weight, 1.6-2.4, capped at 40% of calories
            const ppk = clamp(num(p.proteinPerKg) || 1.8, 1.6, 2.4);
            let pG = Math.round(ppk * kg);
            if (pG * 4 > cals * 0.4) { pG = Math.round(cals * 0.4 / 4); flags.push('Protein capped at 40% of calories.'); }

            // Fat: 20-40% of calories (default 25%), carbs fill the remainder
            const fatPct = clamp(num(p.fatPct) || 25, 20, 40) / 100;
            let fG = Math.round(cals * fatPct / 9);
            let cG = Math.round((cals - pG * 4 - fG * 9) / 4);
            if (cG < 0) { fG = Math.round(cals * 0.2 / 9); cG = Math.max(0, Math.round((cals - pG * 4 - fG * 9) / 4)); }

            const fiber = Math.round(cals / 1000 * 14);
            return { targets: { calories: cals, protein: pG, carbs: cG, fat: fG, fiber }, bmr: Math.round(bmr), tdee, delta, flags, kg, ppk };
        };

        /* ---------- evidence library ---------- */
        const GRADES = {
            A: { color: 'var(--lime)', name: 'Randomized evidence', text: 'Randomized trial(s) or a meta-analysis of randomized trials that tested this question directly.' },
            B: { color: 'var(--teal)', name: 'Guideline', text: 'A clinical guideline or dietary reference standard built on trials plus expert review.' },
            C: { color: 'var(--amber)', name: 'Supporting evidence', text: 'A validation study, mathematical model, regulatory standard or consensus. No direct randomized trial exists for this item.' }
        };
        const EVIDENCE = [
            {
                id: 'protein', grade: 'A', title: 'Protein target', usedIn: 'Daily protein goal (default 1.8 g/kg, adjustable 1.6-2.4)',
                summary: 'Total protein of about 1.6 g/kg/day or more supports lean-mass gains from lifting. In a hard calorie deficit, 2.4 g/kg/day preserved and even added lean mass better than 1.2 g/kg/day.',
                studies: [
                    { cite: 'Morton RW et al. Br J Sports Med 2018;52(6):376-384', design: 'Systematic review and meta-analysis of 49 randomized trials (1,863 adults), resistance training for 6 weeks or more', finding: 'Protein supplementation improved strength, lean mass and muscle size. Extra benefit for lean mass levelled off around 1.62 g/kg/day total intake (upper confidence bound about 2.2).' },
                    { cite: 'Longland TM et al. Am J Clin Nutr 2016;103(3):738-746', design: 'Single-blind randomized trial, 40 young men, 4 weeks, about 40% energy deficit plus intense training', finding: '2.4 vs 1.2 g/kg/day: lean mass +1.2 vs +0.1 kg; fat mass -4.8 vs -3.5 kg.' }
                ],
                caveat: 'The meta-analysis excluded weight-loss studies. The deficit trial was short, in lean young men training six days a week. Talk to a clinician before raising protein if you have kidney disease.'
            },
            {
                id: 'pace', grade: 'A', title: 'Rate of weight loss', usedIn: 'Weekly rate card on the Trends tab (0.5-1.0% of body weight per week)',
                summary: 'In athletes lifting four times a week, losing about 0.7% of body weight per week gained more lean mass and strength than losing about 1.4% per week.',
                studies: [
                    { cite: 'Garthe I et al. Int J Sport Nutr Exerc Metab 2011;21(2):97-104', design: 'Randomized trial, 24 elite athletes, 0.7% vs 1.4% body weight per week with 4 resistance sessions per week (open-label, DEXA body composition)', finding: 'The slower group increased lean mass and 1RM strength more; both groups lost similar fat.' },
                    { cite: 'Garthe I et al. Int J Sport Nutr Exerc Metab 2011;21(5):426-435', design: '6 and 12 month follow-up of the same trial', finding: 'No group differences after 12 months.' }
                ],
                caveat: 'Small trial in elite athletes. The 0.5-1.0% band is this app\'s rule built around the tested 0.7% arm. Daily scale weight swings with water, so the app compares weekly averages.'
            },
            {
                id: 'floor', grade: 'B', title: 'Calorie deficit and minimum intake', usedIn: 'Deficit limit and 1,200 / 1,500 kcal/day floor in your targets',
                summary: 'Guidelines for adults with overweight or obesity advise a 500-750 kcal/day deficit, or 1,200-1,500 kcal/day for women and 1,500-1,800 for men. Very low-calorie diets (under 800 kcal/day) are for medically monitored programs only.',
                studies: [
                    { cite: 'Jensen MD et al. 2013 AHA/ACC/TOS Guideline for the Management of Overweight and Obesity in Adults. Circulation 2014;129(25 Suppl 2):S102-S138', design: 'Clinical guideline with graded evidence review; its authors rate calorie restriction by these methods as strong evidence (NHLBI grade A)', finding: 'Source of the deficit sizes, the calorie ranges and the under-800 kcal caution.' }
                ],
                caveat: 'The guideline covers adults with overweight or obesity. The app uses its lower bounds as a safety floor for everyone and also caps the deficit at 25% of maintenance, which is a conservative app rule rather than a trial result. Not for teens, pregnancy, or anyone with an eating-disorder history.'
            },
            {
                id: 'macros', grade: 'A', title: 'Carbohydrate vs fat split', usedIn: 'Fat 25% of calories (adjustable 20-40%), carbs fill the rest. The old body-type ratios are no longer used.',
                summary: 'Once calories and protein are set, the carb-to-fat split makes little difference to fat loss over a year. Pick the split you can stick to.',
                studies: [
                    { cite: 'Sacks FM et al. N Engl J Med 2009;360(9):859-873', design: 'Randomized trial, 811 overweight adults, 2 years, four diets differing in fat, protein and carbohydrate', finding: 'Clinically meaningful weight loss on all diets, with no meaningful differences between them.' },
                    { cite: 'Gardner CD et al. JAMA 2018;319(7):667-679 (DIETFITS)', design: 'Randomized trial, 609 adults, 12 months, healthy low-fat vs healthy low-carb', finding: 'No significant difference in weight change. Neither genotype pattern nor insulin response predicted who did better on which diet.' }
                ],
                caveat: 'Ecto/meso/endomorph "body type" macro ratios have no randomized support, so the calculator ignores them. Your saved body type is kept in your profile data untouched.'
            },
            {
                id: 'weigh', grade: 'A', title: 'Daily weigh-ins', usedIn: 'Daily weight box and weekly-average trend (not day-to-day reactions)',
                summary: 'Weighing daily with feedback produced more weight loss than a delayed-start control, with no increase in adverse psychological outcomes in that trial.',
                studies: [
                    { cite: 'Steinberg DM et al. Obesity 2013;21(9):1789-1797', design: 'Randomized trial, 91 overweight adults, 6 months (open-label)', finding: 'The daily self-weighing group lost significantly more weight than controls at 3 and 6 months.' },
                    { cite: 'Steinberg DM et al. Am J Prev Med 2014 (same trial, psychological outcomes)', design: 'Randomized trial, 6 months', finding: 'No adverse psychological outcomes from daily weighing.' }
                ],
                caveat: 'Participants also got weekly tailored feedback, and the trial excluded people who were not trying to lose weight. If weighing makes you anxious, or you have a history of disordered eating, skip it and talk to a clinician.'
            },
            {
                id: 'volume', grade: 'A', title: 'Weekly sets per muscle group', usedIn: 'Weekly sets panel on the Train tab (marker at 10 sets)',
                summary: 'More weekly hard sets per muscle were linked to more muscle growth, with 10 or more sets per week outperforming fewer than 5 or 5-9.',
                studies: [
                    { cite: 'Schoenfeld BJ, Ogborn D, Krieger JW. J Sports Sci 2017;35(11):1073-1082', design: 'Systematic review and dose-response meta-analysis of resistance-training studies', finding: 'Graded dose-response between weekly set volume and hypertrophy.' }
                ],
                caveat: 'Most included trials were open-label (lifting cannot be blinded). Returns diminish at high volumes, and little of this evidence comes from people in a calorie deficit.'
            },
            {
                id: 'rest', grade: 'A', title: 'Rest between sets', usedIn: 'Rest timer presets (default 2 minutes)',
                summary: 'Resting 3 minutes between sets built more strength and thigh muscle thickness than resting 1 minute in trained men.',
                studies: [
                    { cite: 'Schoenfeld BJ et al. J Strength Cond Res 2016;30(7):1805-1812', design: 'Randomized trial, 21 resistance-trained men, 8 weeks, 1 vs 3 minute rest', finding: 'Longer rests gave greater gains in strength and quadriceps thickness.' }
                ],
                caveat: 'Small trial in trained men, mostly compound lifts. Shorter rests are fine for smaller isolation exercises.'
            },
            {
                id: 'resistance', grade: 'A', title: 'Resistance training while losing weight', usedIn: 'Train tab and the Drug Check note for GLP-1 medicines',
                summary: 'In older adults with obesity, adding exercise to a weight-loss diet improved physical function, most with combined aerobic plus resistance training. Programs with resistance training limited the lean-mass loss that comes with dieting.',
                studies: [
                    { cite: 'Villareal DT et al. N Engl J Med 2017;376(20):1943-1955 (LIFT)', design: 'Randomized trial, 160 adults aged 65 or older with obesity, 6 months, diet plus aerobic, resistance or combined exercise vs diet-only control (open-label)', finding: 'Physical performance improved in all exercise groups and most in the combined group. Resistance-containing programs preserved more lean mass than aerobic exercise alone.' }
                ],
                caveat: 'Older adults, not taking weight-loss medicines, and exercise cannot be blinded. Younger adults and people on GLP-1 medicines were not studied here.'
            },
            {
                id: 'glp1', grade: 'A', title: 'Weight and lean mass on GLP-1 medicines', usedIn: 'Drug Check: weight signal and muscle note for semaglutide, tirzepatide and related drugs',
                summary: 'In double-blind trials, semaglutide 2.4 mg and tirzepatide produced about 15-21% weight loss over 68-72 weeks versus 2-4% on placebo. In DXA substudies, roughly a quarter to two-fifths of the weight lost registered as lean mass, and with semaglutide the lean share of body mass still rose.',
                studies: [
                    { cite: 'Wilding JPH et al. N Engl J Med 2021;384(11):989-1002 (STEP 1)', design: 'Double-blind randomized trial, 1,961 adults with overweight or obesity, semaglutide 2.4 mg vs placebo, 68 weeks, plus lifestyle intervention', finding: 'Mean weight change about -14.9% vs -2.4%.' },
                    { cite: 'Wilding JPH et al. Body composition analysis of STEP 1 (exploratory DXA substudy, 140 participants)', design: 'Substudy within the double-blind trial, DXA scans at baseline and week 68', finding: 'Weight -15.0% vs -3.6%. Fat mass -19.3%, total lean mass -9.7%, lean share of body mass +3.0 percentage points. About 40% of weight lost was lean mass in secondary analyses.' },
                    { cite: 'Jastreboff AM et al. N Engl J Med 2022;387(3):205-216 (SURMOUNT-1)', design: 'Double-blind randomized trial, 2,539 adults with overweight or obesity, tirzepatide 5, 10 or 15 mg vs placebo, 72 weeks', finding: 'Mean weight change about -15.0%, -19.5%, -20.9% vs -3.1%.' },

                ],
                caveat: 'DXA "lean mass" includes water and organ tissue as well as muscle, so it overstates true muscle loss. Substudies were exploratory and in subsets of participants. Doses approved for diabetes are lower and usually produce less weight loss. None of these trials tested protein or exercise advice on these medicines, and trials that do may have appeared since this page was written.'
            },
            {
                id: 'druglabel', grade: 'C', title: 'Medication label screening', usedIn: 'Drug Check: weight, appetite and metabolic keyword screen of FDA label text',
                summary: 'The Drug Check tool searches the text of an FDA label for weight- and metabolism-related terms and shows the matching excerpts. A hit means the label mentions the term, not that the drug causes it in everyone.',
                studies: [
                    { cite: 'U.S. FDA. Content and format of prescription drug labeling, 21 CFR 201.57. Data via openFDA', design: 'Regulatory standard. The Adverse Reactions section separates events seen in controlled trials from post-marketing reports.', finding: 'Trial tables that compare drug with placebo are the best guide to how common an effect is. Post-marketing reports cannot establish frequency or cause.' }
                ],
                caveat: 'Keyword matching cannot read context, so a sentence like "no weight gain was observed" still matches. Read the excerpt and the label itself. Never stop or change a medicine because of this tool.'
            },
            {
                id: 'bmr', grade: 'C', title: 'Maintenance calories', usedIn: 'Maintenance estimate (Mifflin-St Jeor x activity factor)',
                summary: 'Mifflin-St Jeor was the most accurate common equation for resting energy in a systematic review. Activity factors are rough multipliers.',
                studies: [
                    { cite: 'Mifflin MD et al. Am J Clin Nutr 1990;51(2):241-247', design: 'Derivation study using indirect calorimetry in healthy adults', finding: 'The prediction equation used in this app.' },
                    { cite: 'Frankenfield D et al. J Am Diet Assoc 2005;105(5):775-789', design: 'Systematic review comparing prediction equations with measured resting metabolic rate', finding: 'Mifflin-St Jeor predicted within 10% of measured values for more people than the other equations.' }
                ],
                caveat: 'A randomized trial cannot test a prediction equation, so this is validation evidence. Individual error can exceed 10%. Your own weekly weight trend is the better calibration.'
            },
            {
                id: 'model', grade: 'C', title: 'Why "3,500 kcal = 1 lb" is only a rough guide', usedIn: 'Projected rate shown in the calculator and Profile',
                summary: 'Weight change slows as you lose because energy needs fall. A static 3,500 kcal per pound rule overestimates long-term loss.',
                studies: [
                    { cite: 'Hall KD et al. Lancet 2011;378(9793):826-837', design: 'Mathematical model of human energy balance', finding: 'Dynamic model predicts slower weight change over time than the static rule.' }
                ],
                caveat: 'Modelling, not a trial. The app labels projections as estimates and relies on your measured trend.'
            },
            {
                id: 'fiber', grade: 'C', title: 'Fiber and fat ranges', usedIn: 'Fiber goal of 14 g per 1,000 kcal; fat never below 20% of calories',
                summary: 'The US dietary reference intakes set adequate fiber at 14 g per 1,000 kcal and an acceptable fat range of 20-35% of calories for adults.',
                studies: [
                    { cite: 'Institute of Medicine. Dietary Reference Intakes for Energy, Carbohydrate, Fiber, Fat, Fatty Acids, Cholesterol, Protein, and Amino Acids. National Academies Press; 2005', design: 'Expert consensus standard; the fiber value rests mainly on prospective cohort data', finding: 'Source of both ranges.' }
                ],
                caveat: 'The fiber figure is not from a randomized trial. Treat it as a reasonable reference, not a proven dose. The app lets you set fat up to 40% if you prefer.'
            }
        ];

        /* ---------- routing (hash based, so every section is linkable) ---------- */
        const SECTIONS = ['home', 'calculator', 'tracker', 'drugs', 'workshop'];
        const SECTION_TITLES = { home: 'Home', calculator: 'Macro calculator', tracker: 'Elite Tracker', drugs: 'Drug check', workshop: 'Live workshop' };
        const readHash = () => { const h = window.location.hash.replace('#', ''); return SECTIONS.includes(h) ? h : 'home'; };
        const useSection = () => {
            const [section, setSection] = useState(readHash);
            useEffect(() => {
                const on = () => { setSection(readHash()); window.scrollTo(0, 0); };
                window.addEventListener('hashchange', on);
                return () => window.removeEventListener('hashchange', on);
            }, []);
            useEffect(() => {
                document.title = `${SECTION_TITLES[section]} - John Ruben Solutions`;
                try { if (window.gtag) window.gtag('event', 'page_view', { page_title: document.title, page_path: '/#' + section }); } catch (e) { }
            }, [section]);
            const go = (s) => { if (window.location.hash === '#' + s) window.scrollTo(0, 0); else window.location.hash = s; };
            return [section, go];
        };

        /* ---------- small UI parts ---------- */
        const ICONS = {
            food: <g><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" /></g>,
            train: <g><path d="m6.5 6.5 11 11M21 21l-1-1M3 3l1 1M18 22l4-4M2 6l4-4M3 10l7-7M14 21l7-7" /></g>,
            trends: <g><path d="M3 3v18h18M7 14v4M12 8v10M17 11v7" /></g>,
            science: <g><path d="M10 2v7.5L4.5 19a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L14 9.5V2M8.5 2h7M7 16h10" /></g>,
            you: <g><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></g>,
            camera: <g><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" /><circle cx="12" cy="13" r="3" /></g>,
            left: <g><path d="m15 18-6-6 6-6" /></g>,
            right: <g><path d="m9 18 6-6-6-6" /></g>,
            x: <g><path d="M18 6 6 18M6 6l12 12" /></g>,
            plus: <g><path d="M12 5v14M5 12h14" /></g>,
            edit: <g><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /></g>,
            chev: <g><path d="m9 18 6-6-6-6" /></g>,
            calc: <g><rect x="4" y="3" width="16" height="18" rx="2" /><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01" /></g>,
            pill: <g><path d="m10.5 20.5-7-7a4.95 4.95 0 0 1 7-7l7 7a4.95 4.95 0 0 1-7 7ZM8.5 8.5l7 7" /></g>,
            users: <g><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8" /></g>,
            ext: <g><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /></g>,
            alert: <g><circle cx="12" cy="12" r="10" /><path d="M12 8v4M12 16h.01" /></g>,

            search: <g><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></g>
        };
        const Icon = ({ n, size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{ICONS[n]}</svg>
        );

        const GradeBadge = ({ g }) => (
            <span className="chip" style={{ color: GRADES[g].color, border: `1px solid ${GRADES[g].color}55` }}>Grade {g}</span>

        const Ring = ({ value, max, size = 118 }) => {
            const r = 48, c = 2 * Math.PI * r;
            const pct = max > 0 ? Math.min(1, value / max) : 0;

                <div style={{ width: size, height: size }} className="relative shrink-0">
                    <svg viewBox="0 0 120 120" width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>

        const MacroBar = ({ label, color, v, t }) => {
            const pct = t > 0 ? Math.min(100, (v / t) * 100) : 0;
            return (
                <div>
                    <div className="flex justify-between text-xs mb-1">
                        <span className="font-bold" style={{ color }}>{label}</span>
                        <span className="muted"><span className="text-white font-bold">{Math.round(v)}</span> / {t} g</span>
                    </div>
                    <div className="h-1.5 rounded-full" style={{ background: 'var(--s3)' }}>
                        <div className="h-1.5 rounded-full" style={{ width: pct + '%', background: color, transition: 'width .4s' }}></div>
                    </div>
                </div>
            );
        };

        const beep = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const o = ctx.createOscillator(); const g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.frequency.value = 880; g.gain.value = 0.15;
                o.start(); o.stop(ctx.currentTime + 0.35);
            } catch (e) { }
            try { if (navigator.vibrate) navigator.vibrate(250); } catch (e) { }
        };

        const Timer = () => {
            const [preset, setPreset] = useState(() => { try { return parseInt(localStorage.getItem('restPreset')) || 120; } catch (e) { return 120; } });
            const [left, setLeft] = useState(preset);
            const [active, setActive] = useState(false);
            useEffect(() => {
                if (!active) return;
                if (left <= 0) { setActive(false); beep(); return; }
                const t = setTimeout(() => setLeft(l => l - 1), 1000);
                return () => clearTimeout(t);
            }, [active, left]);
            const pick = (s) => { setPreset(s); setLeft(s); setActive(false); try { localStorage.setItem('restPreset', String(s)); } catch (e) { } };
            const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
            return (
                <div className="card p-4 mb-4">
                    <div className="flex items-center justify-between">
                        <div>
                            <div className="text-sm font-bold">Rest timer</div>
                            <div className="text-xs muted">2-3 min for big lifts, 60-90 s for small ones</div>
                        </div>
                        <span className={`font-mono text-3xl font-bold ${active ? 'pulse' : ''}`} style={{ color: active ? 'var(--teal)' : 'var(--mut)' }}>{fmt(left)}</span>
                    </div>
                    <div className="flex items-center gap-2 mt-3">
                        {[60, 90, 120, 180].map(s => (
                            <button key={s} onClick={() => pick(s)} className="chip" style={{ background: preset === s ? 'var(--teal)' : 'var(--s2)', color: preset === s ? '#0b1220' : 'var(--tx)' }}>{s % 60 === 0 ? (s / 60) + ' min' : s + ' s'}</button>
                        ))}
                        <div className="flex-1"></div>
                        <button onClick={() => { setLeft(preset); setActive(false); }} className="btn btn-ghost" style={{ padding: '.4rem .8rem' }}>Reset</button>
                        <button onClick={() => { if (left <= 0) setLeft(preset); setActive(!active); }} className={`btn ${active ? 'btn-danger' : 'btn-teal'}`} style={{ padding: '.4rem 1rem' }}>{active ? 'Stop' : 'Start'}</button>
                    </div>
                </div>
            );
        };

        const SetRow = ({ idx, existing, last, onSave, onClear }) => {
            const [reps, setReps] = useState(existing ? existing.reps : "");
            const [w, setW] = useState(existing ? existing.weight : (last ? last.weight : ""));
            useEffect(() => {
                if (existing) { setReps(existing.reps); setW(existing.weight); }
            }, [existing && existing.reps, existing && existing.weight]);
            const commit = async () => {
                if (reps !== "" && w !== "" && num(reps) > 0 && num(w) >= 0) await onSave(idx, reps, w);
                else if (reps === "" && existing) { await onClear(idx); setW(last ? last.weight : ""); }
            };
            return (
                <div className="flex items-center gap-2 p-2 rounded-xl" style={{ background: existing ? 'rgba(34,211,238,.07)' : 'var(--s2)' }}>
                    <span className="w-6 text-center text-xs font-bold muted">{idx + 1}</span>
                    <input type="number" inputMode="numeric" placeholder="Reps" value={reps} onChange={e => setReps(e.target.value)} onBlur={commit} aria-label={`Set ${idx + 1} reps`} className="field text-center font-bold" style={{ padding: '.55rem' }} />
                    <input type="number" inputMode="decimal" placeholder="Lbs" value={w} onChange={e => setW(e.target.value)} onBlur={commit} aria-label={`Set ${idx + 1} weight in pounds`} className="field text-center font-bold" style={{ padding: '.55rem', color: 'var(--teal)' }} />
                    <span className="w-20 text-[11px] muted text-right leading-tight">{last ? <>Last<br />{last.reps} x {last.weight}</> : ''}</span>
                </div>
            );
        };

        const Disclaimer = () => (
            <div className="text-center pt-8 pb-4 mt-10" style={{ borderTop: '1px solid var(--line)' }}>
                <p className="text-[11px] font-bold muted mb-2">&copy; 2026 John Ruben Solutions, LLC.</p>
                <p className="text-[11px] leading-relaxed max-w-lg mx-auto" style={{ color: '#6b7a96' }}>
                    <strong>Disclaimer:</strong> Educational purposes only. Not medical advice. Always seek the advice of your physician regarding medical conditions. John Ruben Rajendran is a licensed pharmacist, but he is not YOUR pharmacist.
                </p>
                <a href={LINKS.disclaimer} target="_top" className="text-[11px] underline mt-2 inline-block" style={{ color: 'var(--teal)' }}>View full disclaimer</a>
            </div>
        );

        /* ---------- auth ---------- */
        const AuthScreen = ({ onBack }) => {
            const [isRegister, setIsRegister] = useState(false);
            const [isReset, setIsReset] = useState(false);
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [error, setError] = useState("");
            const [successMsg, setSuccessMsg] = useState("");

            const handleGoogleLogin = async () => {
                if (!window.fb) { setError("Sign-in is still loading. Wait a moment and try again."); return; }
                try { await window.fb.signInWithPopup(window.fb.auth, window.fb.googleProvider); }
                catch (err) { setError(err.message); }
            };
            const handleSubmit = async (e) => {
                e.preventDefault();
                setError(""); setSuccessMsg("");
                if (!window.fb) { setError("Sign-in is still loading. Wait a moment and try again."); return; }
                try {
                    if (isReset) {
                        await window.fb.sendPasswordResetEmail(window.fb.auth, email);
                        setSuccessMsg("Reset link sent. Check your email.");
                        setTimeout(() => setIsReset(false), 3000);
                    } else if (isRegister) {
                        await window.fb.createUserWithEmailAndPassword(window.fb.auth, email, password);
                    } else {
                        await window.fb.signInWithEmailAndPassword(window.fb.auth, email, password);
                    }
                } catch (err) { setError(err.message); }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="card p-8 w-full max-w-sm pop" style={{ boxShadow: '0 20px 60px rgba(0,0,0,.45)' }}>
                        <button onClick={onBack} className="inline-flex items-center gap-1 text-xs muted mb-4 hover:text-white"><Icon n="left" size={16} /> Back to home</button>
                        <h1 className="text-2xl font-extrabold mb-1 text-center">{isReset ? "Reset password" : (isRegister ? "Join Elite Tracker" : "Elite Tracker")}</h1>
                        <p className="text-xs muted text-center mb-6">Nutrition and training, tied to the research.</p>

                        {!isReset && (
                            <button onClick={handleGoogleLogin} className="btn w-full mb-4" style={{ background: '#fff', color: '#0b1220' }}>Continue with Google</button>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-3">
                            <input type="email" placeholder="Email" autoComplete="email" className="field" value={email} onChange={e => setEmail(e.target.value)} required />
                            {!isReset && (
                                <input type="password" placeholder="Password" autoComplete={isRegister ? "new-password" : "current-password"} className="field" value={password} onChange={e => setPassword(e.target.value)} required />
                            )}
                            {error && <p className="text-xs text-center" style={{ color: 'var(--red)' }}>{error}</p>}
                            {successMsg && <p className="text-xs text-center" style={{ color: 'var(--lime)' }}>{successMsg}</p>}
                            <button type="submit" className="btn btn-lime w-full">{isReset ? "Send reset link" : (isRegister ? "Sign up" : "Log in")}</button>
                        </form>

                        {!isReset && !isRegister && (
                            <button onClick={() => { setIsReset(true); setError(""); }} className="w-full mt-4 text-xs" style={{ color: 'var(--teal)' }}>Forgot password?</button>
                        )}
                        {isReset ? (
                            <button onClick={() => { setIsReset(false); setError(""); }} className="w-full mt-4 text-xs muted underline">Back to login</button>
                        ) : (
                            <button onClick={() => { setIsRegister(!isRegister); setError(""); }} className="w-full mt-4 text-xs muted underline">
                                {isRegister ? "Already have an account? Log in" : "Need an account? Sign up"}
                            </button>
                        )}

                        <div className="mt-8 pt-4 text-center" style={{ borderTop: '1px solid var(--line)' }}>
                            <p className="text-xs font-bold muted mb-2">New here?</p>
                            <p className="text-[11px] muted leading-relaxed">
                                Tap <strong>Need an account? Sign up</strong>, enter your email and a secure password, then tap <strong>Sign up</strong>. You will land on your dashboard. Open the <strong>You</strong> tab first to set up your profile.
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        /* =====================================================================
           HOME
           ===================================================================== */
        const Home = ({ go }) => (
            <div>
                <section className="pt-4 pb-6">
                    <h1 className="text-4xl md:text-5xl font-extrabold tracking-tight leading-[1.05]">Weight management, grounded in randomized trials.</h1>
                    <p className="muted text-sm md:text-base leading-relaxed mt-4 max-w-xl">
                        Whether you want to <strong className="text-white">lose weight</strong>, <strong className="text-white">gain muscle</strong> or <strong className="text-white">live healthier</strong>, these <strong className="text-white">free tools</strong> help you set metabolic targets, track them, and check what your medications say about weight. Every number links back to its source.
                    </p>
                </section>

                <div className="grid md:grid-cols-3 gap-3">
                    <button onClick={() => go('calculator')} className="card flow-card p-5">
                        <div className="flex items-center justify-between mb-4">
                            <span className="step-n" style={{ color: 'var(--lime)' }}>1</span>
                            <span style={{ color: 'var(--lime)' }}><Icon n="calc" size={24} /></span>
                        </div>
                        <div className="font-extrabold text-lg">Set your targets</div>
                        <p className="text-xs muted leading-relaxed mt-1">Calories, protein, carbs and fat from your size, activity and goal. No account needed.</p>
                    </button>
                    <button onClick={() => go('tracker')} className="card flow-card t p-5">
                        <div className="flex items-center justify-between mb-4">
                            <span className="step-n" style={{ color: 'var(--teal)' }}>2</span>
                            <span style={{ color: 'var(--teal)' }}><Icon n="trends" size={24} /></span>
                        </div>
                        <div className="font-extrabold text-lg">Track it</div>
                        <p className="text-xs muted leading-relaxed mt-1">Log food and lifting, scan barcodes, and watch your weekly trend in Elite Tracker.</p>
                    </button>
                    <button onClick={() => go('drugs')} className="card flow-card v p-5">
                        <div className="flex items-center justify-between mb-4">
                            <span className="step-n" style={{ color: 'var(--violet)' }}>3</span>
                            <span style={{ color: 'var(--violet)' }}><Icon n="pill" size={24} /></span>
                        </div>
                        <div className="font-extrabold text-lg">Check your medications</div>
                        <p className="text-xs muted leading-relaxed mt-1">See which weight and metabolic effects an FDA label mentions, with the label text beside it.</p>
                    </button>
                </div>

                <button onClick={() => go('workshop')} className="card flow-card w-full mt-3 p-4" style={{ borderColor: 'rgba(163,230,53,.35)' }}>
                    <div className="flex items-center gap-4">
                        <div className="p-3 rounded-full" style={{ background: 'var(--bg)' }}><div className="live-dot"></div></div>
                        <div className="flex-1">
                            <div className="font-extrabold text-sm">Would you join a live workshop?</div>
                            <div className="text-xs muted mt-0.5">Two-minute survey to help decide the topics, format and timing.</div>
                        </div>
                        <span className="muted"><Icon n="right" /></span>
                    </div>
                </button>

                <div className="grid grid-cols-2 gap-3 mt-3">
                    <a href={LINKS.protocols} target="_top" className="card flow-card p-4 flex items-center justify-between">
                        <div><div className="font-bold text-sm">Protocols</div><div className="text-[11px] muted mt-0.5">Learn more</div></div>
                        <span className="muted"><Icon n="ext" size={18} /></span>
                    </a>
                    <a href={LINKS.about} target="_top" className="card flow-card p-4 flex items-center justify-between">
                        <div><div className="font-bold text-sm">About me</div><div className="text-[11px] muted mt-0.5">Who is behind this</div></div>
                        <span className="muted"><Icon n="ext" size={18} /></span>
                    </a>
                </div>

                <p className="italic text-xs md:text-sm mt-8 pl-3 max-w-md" style={{ color: 'rgba(163,230,53,.9)', borderLeft: '2px solid var(--lime)' }}>
                    "For God gave us a spirit not of fear but of power and love and self-control." &mdash; 2 Timothy 1:7
                </p>
            </div>
        );

        /* =====================================================================
           MACRO CALCULATOR (public, same engine as the tracker)
           ===================================================================== */
        const GOAL_OPTIONS = [['-750', 'Lose, steady (-750 kcal)'], ['-500', 'Lose, moderate (-500 kcal)'], ['-250', 'Lose, gentle (-250 kcal)'], ['0', 'Maintain'], ['250', 'Gain, lean (+250 kcal)'], ['500', 'Gain, faster (+500 kcal)']];
        const ACTIVITY_OPTIONS = [['1.2', 'Sedentary, desk job, little exercise'], ['1.375', 'Light, exercise 1-3 days/week'], ['1.55', 'Moderate, exercise 3-5 days/week'], ['1.725', 'High, exercise 6-7 days/week'], ['1.9', 'Very high, physical job plus training']];

        const Calculator = ({ go }) => {
            const [c, setC] = useState({ weight: '', weightUnit: 'lb', height: '', heightUnit: 'in', age: '', gender: 'male', activity: '1.55', goal: '-500', proteinPerKg: '1.8', fatPct: '25' });
            const set = (k, v) => setC(p => ({ ...p, [k]: v }));
            const wLb = c.weightUnit === 'kg' ? num(c.weight) / 0.453592 : num(c.weight);
            const ready = wLb >= 50 && wLb <= 700 && num(c.height) > 0 && num(c.age) > 0;
            const out = useMemo(() => ready ? computeTargets(c, wLb) : null, [c, wLb, ready]);
            const t = out && out.targets;
            const kcalSplit = t ? { p: t.protein * 4, c: t.carbs * 4, f: t.fat * 9 } : null;
            const tot = kcalSplit ? (kcalSplit.p + kcalSplit.c + kcalSplit.f) || 1 : 1;

            return (
                <div className="space-y-4">
                    <div>
                        <h1 className="text-3xl font-extrabold tracking-tight">Macro target calculator</h1>
                        <p className="text-sm muted mt-2 leading-relaxed">Your daily calories and macros, built on trial-based rules. Nothing is saved or sent anywhere.</p>
                    </div>

                    <div className="card p-5">
                        <div className="grid grid-cols-2 gap-3">
                            <label className="text-xs muted">Weight
                                <div className="flex gap-2 mt-1">
                                    <input type="number" inputMode="decimal" className="field" value={c.weight} onChange={e => set('weight', e.target.value)} placeholder={c.weightUnit === 'lb' ? '180' : '82'} />
                                    <select className="field" style={{ width: 80 }} value={c.weightUnit} onChange={e => set('weightUnit', e.target.value)}><option value="lb">lb</option><option value="kg">kg</option></select>
                                </div>
                            </label>
                            <label className="text-xs muted">Height
                                <div className="flex gap-2 mt-1">
                                    <input type="number" inputMode="decimal" className="field" value={c.height} onChange={e => set('height', e.target.value)} placeholder={c.heightUnit === 'in' ? '70' : '178'} />
                                    <select className="field" style={{ width: 80 }} value={c.heightUnit} onChange={e => set('heightUnit', e.target.value)}><option value="in">in</option><option value="cm">cm</option></select>
                                </div>
                            </label>
                            <label className="text-xs muted">Age
                                <input type="number" inputMode="numeric" className="field mt-1" value={c.age} onChange={e => set('age', e.target.value)} placeholder="30" />
                            </label>
                            <label className="text-xs muted">Sex used in the energy equation
                                <select className="field mt-1" value={c.gender} onChange={e => set('gender', e.target.value)}><option value="male">Male</option><option value="female">Female</option></select>
                            </label>
                            <label className="text-xs muted col-span-2">Activity
                                <select className="field mt-1" value={c.activity} onChange={e => set('activity', e.target.value)}>{ACTIVITY_OPTIONS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}</select>
                            </label>
                            <label className="text-xs muted col-span-2">Goal
                                <select className="field mt-1" value={c.goal} onChange={e => set('goal', e.target.value)}>{GOAL_OPTIONS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}</select>
                            </label>
                            <label className="text-xs muted">Protein (g per kg)
                                <input type="number" step="0.1" min="1.6" max="2.4" inputMode="decimal" className="field mt-1" value={c.proteinPerKg} onChange={e => set('proteinPerKg', e.target.value)} />
                            </label>
                            <label className="text-xs muted">Fat (% of calories)
                                <input type="number" step="1" min="20" max="40" inputMode="numeric" className="field mt-1" value={c.fatPct} onChange={e => set('fatPct', e.target.value)} />
                            </label>
                        </div>
                        <p className="text-[11px] muted mt-3 leading-relaxed">Protein stays between 1.6 and 2.4 g/kg and fat between 20% and 40%. Carbs fill the rest.</p>
                    </div>

                    {!out ? (
                        <div className="card p-5 text-sm muted">Enter your weight, height and age to see your targets.</div>
                    ) : (
                        <div className="card p-5" style={{ borderColor: 'rgba(163,230,53,.35)' }}>
                            <div className="flex items-end justify-between">
                                <div>
                                    <div className="text-xs muted">Daily target</div>
                                    <div className="text-4xl font-extrabold" style={{ color: 'var(--lime)' }}>{t.calories.toLocaleString()}<span className="text-sm muted font-bold"> kcal</span></div>
                                </div>
                                <div className="text-right text-xs muted leading-relaxed">
                                    <div>Resting <b className="text-white">{out.bmr.toLocaleString()}</b></div>
                                    <div>Maintenance <b className="text-white">{out.tdee.toLocaleString()}</b></div>
                                    <div>Goal <b className="text-white">{out.delta > 0 ? '+' : ''}{out.delta}</b></div>
                                </div>
                            </div>
                            <div className="flex h-2 rounded-full overflow-hidden mt-4" aria-hidden="true">
                                <div style={{ width: (kcalSplit.p / tot * 100) + '%', background: 'var(--teal)' }}></div>
                                <div style={{ width: (kcalSplit.c / tot * 100) + '%', background: 'var(--lime)' }}></div>
                                <div style={{ width: (kcalSplit.f / tot * 100) + '%', background: 'var(--amber)' }}></div>
                            </div>
                            <div className="grid grid-cols-4 gap-2 text-center mt-4 text-xs">
                                {[['Protein', t.protein, 'var(--teal)'], ['Carbs', t.carbs, 'var(--lime)'], ['Fat', t.fat, 'var(--amber)'], ['Fiber', t.fiber, 'var(--violet)']].map(([l, v, col]) => (
                                    <div key={l} className="inset p-2"><div className="font-bold" style={{ color: col }}>{l}</div><div className="font-extrabold text-sm">{v} g</div></div>
                                ))}
                            </div>
                            {out.delta !== 0 && (
                                <p className="text-xs muted leading-relaxed mt-4">Projected change is roughly {(out.delta * 7 / 3500).toFixed(1)} lb per week at first. It usually slows over time, so trust your measured trend over this estimate.</p>
                            )}
                            {out.flags.map((fl, i) => <p key={i} className="text-xs mt-2" style={{ color: 'var(--amber)' }}>{fl}</p>)}
                            <div className="flex gap-2 mt-5 flex-wrap">
                                <button onClick={() => go('tracker')} className="btn btn-lime">Track these in Elite Tracker</button>
                                <button onClick={() => go('drugs')} className="btn btn-ghost">Check a medication</button>
                            </div>
                            <p className="text-[11px] muted mt-4 leading-relaxed">Estimates for general wellness, not medical advice. Rules and sources are listed in the Science tab of the tracker. Talk to a clinician first if you are pregnant or breastfeeding, have diabetes or take glucose-lowering medicine, have kidney disease, or have a history of disordered eating.</p>
                        </div>
                    )}
                </div>
            );
        };

        /* =====================================================================
           DRUG CHECK (openFDA label screen)
           ===================================================================== */
        const SECTION_LABELS = {
            adverse_reactions: 'Adverse reactions', warnings: 'Warnings', warnings_and_cautions: 'Warnings and precautions',
            boxed_warning: 'Boxed warning', clinical_studies: 'Clinical studies', precautions: 'Precautions'
        };
        const KEYWORDS = {
            gain: ['weight gain', 'weight increased', 'increase in weight', 'increased weight', 'fluid retention', 'increased appetite', 'hyperphagia', 'edema', 'obesity', 'fat redistribution', 'body mass index increased', 'metabolic syndrome'],
            loss: ['weight loss', 'weight decreased', 'decrease in weight', 'decreased weight', 'decreased appetite', 'loss of appetite', 'anorexia', 'cachexia', 'body mass index decreased', 'wasting', 'failure to thrive'],
            metabolic: ['hyperglycemia', 'hypoglycemia', 'insulin resistance', 'dyslipidemia', 'hyperlipidemia', 'hypertriglyceridemia', 'cholesterol increased', 'triglycerides increased', 'metabolic acidosis', 'metabolic alkalosis', 'thyroid function', 'hypothyroidism', 'hyperthyroidism']
        };
        const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const scanLabel = (drug, sectionKeys, words) => {
            const hits = []; const seen = new Set();
            sectionKeys.forEach(key => {
                (drug[key] || []).forEach(raw => {
                    const text = String(raw);
                    words.forEach(w => {
                        if (seen.has(w)) return;
                        const m = new RegExp('\\b' + esc(w) + '\\b', 'i').exec(text);
                        if (!m) return;
                        seen.add(w);
                        const s = Math.max(0, m.index - 110), e = Math.min(text.length, m.index + m[0].length + 110);
                        hits.push({ term: w, section: SECTION_LABELS[key], snippet: (s > 0 ? '... ' : '') + text.slice(s, e).replace(/\s+/g, ' ').trim() + (e < text.length ? ' ...' : '') });
                    });
                });
            });
            return hits;
        };
        const GLP1_NAMES = ['semaglutide', 'tirzepatide', 'liraglutide', 'dulaglutide', 'exenatide', 'lixisenatide'];
        const GLP1_WEIGHT_MSG = {
            semaglutide: 'In the double-blind STEP 1 trial, semaglutide 2.4 mg lowered body weight by about 15% over 68 weeks versus about 2% on placebo. Doses approved for diabetes are lower and usually produce less weight loss.',
            tirzepatide: 'In the double-blind SURMOUNT-1 trial, tirzepatide lowered body weight by about 15-21% over 72 weeks depending on dose, versus about 3% on placebo. Doses approved for diabetes start lower.',
            other: 'This GLP-1-class label lists weight loss and decreased appetite. The size of the effect varies by drug and dose, and is generally smaller than with semaglutide 2.4 mg or tirzepatide.'
        };

        const analyzeDrug = (d) => {
            const generic = ((d.openfda.generic_name || [''])[0] || '').toLowerCase();
            const brand = ((d.openfda.brand_name || [''])[0] || '').toLowerCase();
            let mechanism = "Mechanism of action data not available in the standard FDA summary.";
            if (d.mechanism_of_action && d.mechanism_of_action.length > 0) {
                mechanism = String(d.mechanism_of_action[0]).replace(/Mechanism of Action/i, "").trim() || mechanism;
            }
            const glp1 = GLP1_NAMES.find(n => generic.includes(n) || brand.includes(n)) || (['ozempic', 'wegovy', 'rybelsus', 'mounjaro', 'zepbound', 'saxenda', 'victoza', 'trulicity', 'byetta', 'bydureon'].some(n => brand.includes(n)) ? 'other' : null);
            const weightSections = ['adverse_reactions', 'warnings', 'warnings_and_cautions', 'boxed_warning', 'clinical_studies'];
            const metaSections = ['adverse_reactions', 'warnings', 'warnings_and_cautions', 'boxed_warning', 'precautions'];
            const gain = scanLabel(d, weightSections, KEYWORDS.gain);
            const loss = scanLabel(d, weightSections, KEYWORDS.loss);
            const metabolic = scanLabel(d, metaSections, KEYWORDS.metabolic);
            const kind = glp1 ? (glp1 === 'semaglutide' || glp1 === 'tirzepatide' ? glp1 : 'other') : null;
            return { mechanism, gain, loss, metabolic, glp1: !!glp1, glp1Msg: kind ? GLP1_WEIGHT_MSG[kind] : '' };
        };

        const Excerpts = ({ hits }) => (
            <details className="mt-3">
                <summary className="text-xs font-bold inline-flex items-center gap-1" style={{ color: 'var(--teal)' }}><span className="chev"><Icon n="chev" size={14} /></span> Show label excerpts ({hits.length})</summary>
                <div className="mt-2 space-y-2">
                    {hits.slice(0, 5).map((h, i) => (
                        <div key={i} className="inset p-3 text-xs leading-relaxed">
                            <div className="font-bold">"{h.term}" <span className="muted font-medium">in {h.section}</span></div>
                            <div className="muted mt-1">{h.snippet}</div>
                        </div>
                    ))}
                </div>
            </details>
        );

        const DrugCheck = ({ go }) => {
            const [query, setQuery] = useState("");
            const [resultsList, setResultsList] = useState([]);
            const [selected, setSelected] = useState(null);
            const [showDropdown, setShowDropdown] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            const [moaOpen, setMoaOpen] = useState(false);
            const dropdownRef = useRef(null);

            useEffect(() => {
                const onDown = (event) => { if (dropdownRef.current && !dropdownRef.current.contains(event.target)) setShowDropdown(false); };
                document.addEventListener("mousedown", onDown);
                return () => document.removeEventListener("mousedown", onDown);
            }, []);

            const handleSearch = async (e) => {
                e.preventDefault();
                const q = query.trim().replace(/["\\]/g, '');
                if (!q) return;
                setLoading(true); setError(""); setSelected(null); setShowDropdown(false); setMoaOpen(false);
                try {
                    const search = `openfda.brand_name:"${q}"+OR+openfda.generic_name:"${q}"`;
                    const response = await fetch(`https://api.fda.gov/drug/label.json?search=${encodeURI(search).replace(/%2B/g, '+')}&limit=25`);
                    const data = await response.json();
                    if (data.error || !data.results) { setError("No medications found. Check the spelling, or try the generic name."); setResultsList([]); }
                    else {
                        const seen = new Set();
                        const valid = data.results.filter(r => r.openfda && r.openfda.brand_name).filter(r => {
                            const k = (r.openfda.brand_name[0] + '|' + ((r.openfda.generic_name || [''])[0]) + '|' + ((r.openfda.manufacturer_name || [''])[0])).toLowerCase();
                            if (seen.has(k)) return false; seen.add(k); return true;
                        });
                        if (!valid.length) { setError("No labels with a brand name were found. Try the generic name."); setResultsList([]); }
                        else { setResultsList(valid); setShowDropdown(true); }
                    }
                } catch (err) { setError("The FDA database could not be reached. Check your connection and try again."); }
                finally { setLoading(false); }
            };

            const selectDrug = (d) => {
                setSelected({
                    name: d.openfda.brand_name[0],
                    generic: d.openfda.generic_name ? d.openfda.generic_name[0] : "Generic not listed",
                    manufacturer: d.openfda.manufacturer_name ? d.openfda.manufacturer_name[0] : "Unknown",
                    ...analyzeDrug(d)
                });
                setShowDropdown(false); setQuery(""); setMoaOpen(false);
                try { if (window.gtag) window.gtag('event', 'drug_check', { drug: d.openfda.brand_name[0] }); } catch (e) { }
            };

            const sel = selected;
            return (
                <div className="space-y-5">
                    <div>
                        <h1 className="text-3xl font-extrabold tracking-tight">Drug check</h1>
                        <p className="text-sm muted mt-2 leading-relaxed">Search a medication to see what its FDA label says about weight and metabolism. This tool reads label text. It does not tell you whether a drug will affect you.</p>
                    </div>

                    <div className="relative z-20" ref={dropdownRef}>
                        <form onSubmit={handleSearch} className="flex gap-2">
                            <div className="relative flex-1">
                                <span className="absolute left-3.5 top-1/2 -translate-y-1/2 muted"><Icon n="search" size={18} /></span>
                                <input type="text" className="field" style={{ paddingLeft: '2.6rem' }} placeholder="Brand or generic name (e.g. Metformin)" value={query} onChange={e => setQuery(e.target.value)} autoComplete="off" aria-label="Search a medication" />
                            </div>
                            <button type="submit" disabled={loading} className="btn btn-lime" style={{ opacity: loading ? .7 : 1 }}>{loading ? "Searching..." : "Search"}</button>
                        </form>

                        {showDropdown && resultsList.length > 0 && (
                            <div className="card absolute top-full left-0 right-0 mt-2 overflow-hidden z-30 pop" style={{ boxShadow: '0 20px 50px rgba(0,0,0,.5)' }}>
                                <div className="custom-scroll overflow-y-auto" style={{ maxHeight: 288 }}>
                                    {resultsList.map((drug, idx) => (
                                        <button key={idx} onClick={() => selectDrug(drug)} className="block w-full text-left p-3.5 hover:bg-white/5" style={{ borderBottom: '1px solid var(--line)' }}>
                                            <div className="font-bold">{drug.openfda.brand_name[0]}</div>
                                            <div className="text-xs muted mt-0.5">{drug.openfda.generic_name ? drug.openfda.generic_name[0].slice(0, 60) + (drug.openfda.generic_name[0].length > 60 ? "..." : "") : "Generic not listed"}</div>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}
                        {error && <div role="alert" className="mt-3 p-3 rounded-xl text-sm font-bold text-center" style={{ background: 'rgba(248,113,113,.1)', color: 'var(--red)' }}>{error}</div>}
                    </div>

                    {!sel && !error && (
                        <div className="card p-5 text-sm muted leading-relaxed">Try <b className="text-white">Ozempic</b>, <b className="text-white">Zepbound</b>, <b className="text-white">Metformin</b> or <b className="text-white">Prednisone</b>. Results come from the U.S. FDA's openFDA label database.</div>
                    )}

                    {sel && (
                        <div className="card overflow-hidden pop">
                            <div className="p-6" style={{ background: 'var(--s2)' }}>
                                <span className="chip" style={{ background: 'var(--bg)' }}>FDA label data</span>
                                <h2 className="text-3xl font-extrabold mt-3">{sel.name}</h2>
                                <p className="font-medium mt-1" style={{ color: 'var(--teal)' }}>{sel.generic}</p>
                                <p className="text-xs muted mt-3">Manufacturer: {sel.manufacturer}</p>
                            </div>

                            <div className="p-5 space-y-6">
                                <div>
                                    <h3 className="font-extrabold text-sm mb-2">How it works</h3>
                                    <div className="inset p-4 text-sm leading-relaxed muted">
                                        {moaOpen || sel.mechanism.length <= 200 ? sel.mechanism : sel.mechanism.substring(0, 200) + "..."}
                                        {sel.mechanism.length > 200 && (
                                            <button onClick={() => setMoaOpen(!moaOpen)} className="block mt-2 text-xs font-bold" style={{ color: 'var(--teal)' }}>{moaOpen ? "Show less" : "Read full mechanism"}</button>
                                        )}
                                    </div>
                                </div>

                                <div>
                                    <h3 className="font-extrabold text-sm mb-2">Weight signals in the label</h3>
                                    {sel.glp1 && (
                                        <div className="p-4 rounded-2xl mb-3" style={{ background: 'rgba(167,139,250,.1)', border: '1px solid rgba(167,139,250,.35)' }}>
                                            <div className="font-extrabold text-sm" style={{ color: 'var(--violet)' }}>Weight loss shown in randomized trials</div>
                                            <p className="text-xs leading-relaxed mt-1">{sel.glp1Msg}</p>
                                        </div>
                                    )}
                                    {sel.gain.length > 0 && (
                                        <div className="p-4 rounded-2xl mb-3" style={{ background: 'rgba(251,191,36,.08)', border: '1px solid rgba(251,191,36,.35)' }}>
                                            <div className="font-extrabold text-sm" style={{ color: 'var(--amber)' }}>Label mentions weight gain or fluid retention</div>
                                            <p className="text-xs leading-relaxed mt-1 muted">Matched terms: {sel.gain.map(h => h.term).join(', ')}.</p>
                                            <Excerpts hits={sel.gain} />
                                        </div>
                                    )}
                                    {sel.loss.length > 0 && !sel.glp1 && (
                                        <div className="p-4 rounded-2xl mb-3" style={{ background: 'rgba(34,211,238,.08)', border: '1px solid rgba(34,211,238,.35)' }}>
                                            <div className="font-extrabold text-sm" style={{ color: 'var(--teal)' }}>Label mentions weight loss or appetite suppression</div>
                                            <p className="text-xs leading-relaxed mt-1 muted">Matched terms: {sel.loss.map(h => h.term).join(', ')}.</p>
                                            <Excerpts hits={sel.loss} />
                                        </div>
                                    )}
                                    {sel.loss.length > 0 && sel.glp1 && (
                                        <div className="mb-3"><Excerpts hits={sel.loss} /></div>
                                    )}
                                    {sel.gain.length === 0 && sel.loss.length === 0 && !sel.glp1 && (
                                        <div className="inset p-4 text-center">
                                            <div className="font-bold">No weight terms found</div>
                                            <p className="text-xs muted mt-1">The screen found no weight-related keywords in the label sections it reads.</p>
                                        </div>
                                    )}
                                </div>

                                {sel.metabolic.length > 0 && (
                                    <div className="p-4 rounded-2xl" style={{ background: 'rgba(167,139,250,.08)', border: '1px solid rgba(167,139,250,.3)' }}>
                                        <div className="flex items-start gap-2">
                                            <span style={{ color: 'var(--violet)' }}><Icon n="alert" size={18} /></span>
                                            <div>
                                                <div className="font-extrabold text-sm">Label mentions blood sugar, lipid or thyroid effects</div>
                                                <p className="text-xs leading-relaxed mt-1 muted">Matched terms: {sel.metabolic.map(h => h.term).join(', ')}.</p>
                                            </div>
                                        </div>
                                        <Excerpts hits={sel.metabolic} />
                                    </div>
                                )}

                                {sel.glp1 && (
                                    <div className="p-5 rounded-2xl" style={{ background: 'var(--s2)' }}>
                                        <div className="flex items-center gap-2 mb-2" style={{ color: 'var(--teal)' }}><Icon n="train" size={18} /><span className="font-extrabold text-sm">Lean mass and these medicines</span></div>
                                        <p className="text-xs leading-relaxed">Weight lost on these drugs includes lean mass. In DXA substudies of double-blind trials, roughly a quarter to two-fifths of the weight lost was lean mass (semaglutide: about 40%, with lean mass down 9.7% and fat mass down 19.3%; tirzepatide: about 25%). DXA lean mass also counts water and organ tissue, so it overstates muscle loss, and the lean share of body mass still rose with semaglutide.</p>
                                        <p className="text-xs leading-relaxed mt-2">What helps preserve lean mass comes from trials in other groups of people. Higher protein (2.4 vs 1.2 g/kg/day) kept lean mass during a calorie deficit in young men, and resistance-containing exercise limited lean-mass loss during diet-induced weight loss in older adults. No trial cited here tested those steps in people taking these medicines. A reasonable plan to discuss with your prescriber is lifting two to three days a week and protein at 1.6 g/kg/day or more, unless you have kidney disease.</p>
                                        <div className="flex gap-2 mt-3 flex-wrap">
                                            <button onClick={() => go('calculator')} className="btn btn-ghost" style={{ padding: '.45rem .9rem', fontSize: '.78rem' }}>Calculate my protein target</button>
                                            <button onClick={() => go('tracker')} className="btn btn-ghost" style={{ padding: '.45rem .9rem', fontSize: '.78rem' }}>Open the tracker</button>
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="px-6 py-4 text-center" style={{ borderTop: '1px solid var(--line)', background: 'var(--bg)' }}>
                                <p className="text-[11px] muted leading-relaxed">Source: openFDA label text. A keyword match means the label mentions a term, not that the drug causes it for you. Not medical advice. Do not stop or change a medicine without talking to your prescriber or pharmacist.</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        /* =====================================================================
           LIVE WORKSHOP INTEREST SURVEY
           ===================================================================== */
        const Workshop = () => {
            const [agreed, setAgreed] = useState(false);
            const [open, setOpen] = useState(false);
            const plainUrl = WORKSHOP_FORM_URL.replace('?embedded=true', '');
            const unlock = () => {
                if (!agreed) return;
                setOpen(true);
                try { if (window.gtag) window.gtag('event', 'workshop_survey_open'); } catch (e) { }
            };
            return (
                <div className="space-y-4">
                    <div>
                        <h1 className="text-3xl font-extrabold tracking-tight">Would you join a live workshop?</h1>
                        <p className="text-sm muted mt-2 leading-relaxed">I'm gauging interest in a live, educational workshop on evidence-based weight management. Your answers decide whether I run it, which topics come first, and what format and time work best.</p>
                    </div>

                    <div className="card p-5">
                        <h2 className="font-bold text-sm mb-3">Before you start</h2>
                        {!open ? (
                            <>
                                <label className="flex items-start gap-3 cursor-pointer p-3 rounded-xl" style={{ background: 'rgba(251,191,36,.08)', border: '1px solid rgba(251,191,36,.35)' }}>
                                    <input type="checkbox" checked={agreed} onChange={e => setAgreed(e.target.checked)} className="mt-1" style={{ width: 20, height: 20, accentColor: '#a3e635' }} />
                                    <span className="text-xs leading-relaxed" style={{ color: '#fde68a' }}>
                                        I understand this survey only measures interest in a possible workshop. Answering does not reserve a spot or commit me to anything. I agree to be contacted at the email I provide about workshop updates. Any workshop would be for education only, not medical advice, diagnosis or treatment, and John Ruben is acting as an educator, not as my personal pharmacist.
                                    </span>
                                </label>
                                <button onClick={unlock} disabled={!agreed} className="btn btn-lime w-full mt-3" style={{ opacity: agreed ? 1 : .45 }}>Agree and open the survey</button>
                            </>
                        ) : (
                            <div className="flex items-center gap-2 text-sm font-bold" style={{ color: 'var(--lime)' }}><Icon n="check" size={18} /> Agreement recorded for this visit. The survey is below.</div>
                        )}
                    </div>

                    {open && (
                        <div className="card p-2 pop" style={{ borderTop: '4px solid var(--lime)' }}>
                            <iframe title="Live workshop interest survey" src={WORKSHOP_FORM_URL} width="100%" height="1800" frameBorder="0" marginHeight="0" marginWidth="0" style={{ background: '#fff', borderRadius: 12 }}>Loading...</iframe>
                            <a href={plainUrl} target="_blank" rel="noopener noreferrer" className="block text-center text-xs underline py-3" style={{ color: 'var(--teal)' }}>Survey not loading? Open it in a new tab</a>
                        </div>
                    )}
                </div>
            );
        };

        /* =====================================================================
           ELITE TRACKER (all original functionality)
           ===================================================================== */
        const Tracker = ({ user, onHome, go }) => {
            const [tab, setTab] = useState("food");
            const [profile, setProfile] = useState(null);
            const [storedTargets, setStoredTargets] = useState({ calories: 2000, protein: 150, carbs: 200, fat: 60, fiber: 28 });
            const [currentDate, setCurrentDate] = useState(localISO());
            const [toast, setToast] = useState("");

            // nutrition
            const [query, setQuery] = useState("");
            const [results, setResults] = useState([]);
            const [nutritionLog, setNutritionLog] = useState([]);
            const [recent, setRecent] = useState([]);
            const [weightInput, setWeightInput] = useState("");
            const [weightsMap, setWeightsMap] = useState({});
            const [showManual, setShowManual] = useState(false);
            const [manualForm, setManualForm] = useState({ name: "", p: "", c: "", f: "", fib: "" });
            const [selectedFood, setSelectedFood] = useState(null);
            const [displayAmount, setDisplayAmount] = useState(100);
            const [measureUnit, setMeasureUnit] = useState('g');
            const [isScanning, setIsScanning] = useState(false);
            const [loading, setLoading] = useState(false);

            // trends
            const [allLogs, setAllLogs] = useState([]);
            const [chartMode, setChartMode] = useState('weekly');
            const [isChartLoading, setIsChartLoading] = useState(false);

            // training
            const [workoutAll, setWorkoutAll] = useState([]);
            const [customSets, setCustomSets] = useState({});
            const [showLibrary, setShowLibrary] = useState(false);
            const [libQuery, setLibQuery] = useState("");
            const [customEx, setCustomEx] = useState({ name: "", group: "Chest" });
            const [activeRoutine, setActiveRoutine] = useState([]);

            // profile form
            const [form, setForm] = useState({ height: "", heightUnit: "in", age: "", gender: "male", activity: "1.55", goal: "-500", proteinPerKg: "1.8", fatPct: "25" });
            const [formDirty, setFormDirty] = useState(false);

            const scannerRef = useRef(null);
            const chartRef = useRef(null);
            const chartInstance = useRef(null);
            const toastTimer = useRef(null);

            const notify = (m) => { setToast(m); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToast(""), 3500); };
            const fbReady = () => !!window.fb;

            /* profile */
            useEffect(() => { loadProfile(user.uid); }, [user.uid]);

            const loadProfile = async (uid) => {
                try {
                    const snap = await window.fb.getDoc(window.fb.doc(window.fb.db, "users", uid, "data", "profile"));
                    if (snap.exists()) {
                        const p = snap.data();
                        setProfile(p);
                        setForm(f => ({
                            height: p.height ?? "", heightUnit: p.heightUnit || (num(p.height) > 100 ? 'cm' : 'in'), age: p.age ?? "",
                            gender: p.gender || 'male', activity: String(p.activity ?? '1.55'),
                            goal: String(isNaN(parseFloat(p.goal)) ? -500 : parseFloat(p.goal)),
                            proteinPerKg: String(p.proteinPerKg ?? '1.8'), fatPct: String(p.fatPct ?? '25')
                        }));
                    }
                    const tSnap = await window.fb.getDoc(window.fb.doc(window.fb.db, "users", uid, "data", "targets"));
                    if (tSnap.exists()) setStoredTargets(t => ({ ...t, ...tSnap.data() }));
                } catch (e) { console.error("Profile load failed", e); }
            };

            const saveProfile = async () => {
                const data = {
                    height: num(form.height) || "", heightUnit: form.heightUnit, age: num(form.age) || "",
                    gender: form.gender, activity: form.activity, goal: form.goal,
                    proteinPerKg: form.proteinPerKg, fatPct: form.fatPct
                };
                try {
                    // merge:true keeps every existing field (including bodyType) intact
                    await window.fb.setDoc(window.fb.doc(window.fb.db, "users", user.uid, "data", "profile"), data, { merge: true });
                    setProfile(p => ({ ...(p || {}), ...data }));
                    setFormDirty(false);
                    notify("Profile saved. Targets updated.");
                } catch (e) { notify("Could not save profile. Check your connection."); }
            };

            /* weight reference + targets */
            const refWeight = useMemo(() => {
                const w = num(weightInput);
                if (w >= 50) return w;
                const dates = Object.keys(weightsMap).filter(d => d <= currentDate && num(weightsMap[d]) >= 50).sort();
                if (dates.length) return num(weightsMap[dates[dates.length - 1]]);
                const all = Object.keys(weightsMap).filter(d => num(weightsMap[d]) >= 50).sort();
                return all.length ? num(weightsMap[all[all.length - 1]]) : 0;
            }, [weightInput, weightsMap, currentDate]);

            const calc = useMemo(() => (profile && refWeight) ? computeTargets(profile, refWeight) : null, [profile, refWeight]);
