<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flip 7 Score Sheet</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--text:#1c2030;--muted:#6b7288;--line:#e2e5ee;--accent:#e8590c;--accent2:#2f9e44;--danger:#e03131;--gold:#f59f00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c2030;--text:#eceef6;--muted:#9aa2ba;--line:#2e3448;--accent:#ff8a3d;--accent2:#51cf66;--danger:#ff6b6b;--gold:#ffd43b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{margin:0;font-size:1.6rem}h1 span{color:var(--accent)}
h2{margin:0 0 10px;font-size:1.05rem}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
input:focus{outline:2px solid var(--accent);border-color:transparent}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:9px 13px}
button:hover{border-color:var(--accent)}
.pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.dng{color:var(--danger)}
.sm{padding:5px 9px;font-size:.85rem}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px}
.chip button{border:0;padding:2px 7px;background:none;color:var(--muted)}
.muted{color:var(--muted);font-size:.9rem}
.lb{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.pc.lead{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.pc .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .s{font-size:2rem;font-weight:800;line-height:1.1}
.bar{height:6px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent2)}
.entry{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.entry:last-of-type{border-bottom:0}
.entry .ctl{display:flex;gap:6px;align-items:center}
.entry input{width:90px;text-align:center;font-weight:700}
.banner{background:var(--gold);color:#222;border-radius:12px;padding:12px 16px;margin-bottom:14px;font-weight:700}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:.85rem;font-weight:600}
td input{width:70px;text-align:center;padding:6px}
tfoot td{font-weight:800;font-size:1.1rem;border-top:2px solid var(--line);border-bottom:0}
.empty{color:var(--muted);text-align:center;padding:18px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Flip <span>7</span> Score Sheet</h1>
  <div class="row">
    <label class="muted">Target <input id="target" type="number" min="1" style="width:80px"></label>
    <button id="newGame" class="sm">New game (keep players)</button>
    <button id="reset" class="sm dng">Reset all</button>
  </div>
</header>
<div id="banner"></div>

<section class="card">
  <h2>1 · Players</h2>
  <form id="addForm" class="row" onsubmit="return false">
    <input id="pname" placeholder="Add player name…" maxlength="24" style="flex:1;min-width:160px" autocomplete="off">
    <button id="addBtn" class="pri" type="button">Add player</button>
  </form>
  <div id="chips" class="row" style="margin-top:10px"></div>
</section>

<section class="card">
  <h2>2 · Enter round scores <span id="rn" class="muted"></span></h2>
  <div id="entry"></div>
  <div class="row" style="margin-top:10px">
    <button id="save" class="pri">Save round</button>
    <button id="clear" class="sm">Clear inputs</button>
    <span class="muted">Tip: “Bust” = 0 · “+15” adds the Flip 7 bonus · Enter jumps to the next player.</span>
  </div>
</section>

<section class="card">
  <h2>3 · Scoreboard</h2>
  <div id="lb" class="lb"></div>
</section>

<section class="card">
  <div class="row" style="justify-content:space-between;margin-bottom:6px">
    <h2 style="margin:0">Round-by-round (click any score to edit)</h2>
    <button id="addRound" class="sm">+ Add blank round</button>
  </div>
  <div class="scroll"><table id="tbl"></table></div>
</section>
</div>

<script>
const KEY="flip7-scoresheet-v1";
let S={players:[],rounds:[],target:200};
let draft={};
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const total=pid=>S.rounds.reduce((a,r)=>a+(Number(r.scores[pid])||0),0);

function addPlayer(){
  const v=$("pname").value.trim();if(!v)return;
  S.players.push({id:uid(),name:v});$("pname").value="";save();render();$("pname").focus();
}
function removePlayer(id){
  if(!confirm("Remove this player and all of their scores?"))return;
  S.players=S.players.filter(p=>p.id!==id);S.rounds.forEach(r=>delete r.scores[id]);delete draft[id];save();render();
}
function renamePlayer(id){
  const p=S.players.find(x=>x.id===id);const n=prompt("Rename player",p.name);
  if(n&&n.trim()){p.name=n.trim();save();render()}
}
function saveRound(){
  if(!S.players.length){alert("Add at least one player first.");return}
  const scores={};
  S.players.forEach(p=>{const v=parseInt(draft[p.id],10);scores[p.id]=isNaN(v)?0:v});
  S.rounds.push({id:uid(),scores});draft={};save();render();
  const f=document.querySelector("#entry input");if(f)f.focus();
}
function renderChips(){
  $("chips").innerHTML=S.players.length?S.players.map(p=>`<span class="chip"><span ondblclick="renamePlayer('${p.id}')" title="Double-click to rename">${esc(p.name)}</span><button title="Rename" onclick="renamePlayer('${p.id}')">✎</button><button title="Remove" onclick="removePlayer('${p.id}')">✕</button></span>`).join(""):'<span class="muted">No players yet — add everyone at the table.</span>';
}
function renderEntry(){
  $("rn").textContent="— Round "+(S.rounds.length+1);
  $("entry").innerHTML=S.players.length?S.players.map((p,i)=>`<div class="entry"><strong>${esc(p.name)}</strong><div class="ctl"><button class="sm" onclick="setDraft('${p.id}',0)">Bust</button><button class="sm" onclick="bump('${p.id}',15)">+15</button><input type="number" inputmode="numeric" min="0" data-i="${i}" data-p="${p.id}" value="${draft[p.id]??""}" placeholder="0"></div></div>`).join(""):'<div class="empty">Add players above to start scoring.</div>';
  document.querySelectorAll("#entry input").forEach(inp=>{
    inp.addEventListener("input",()=>draft[inp.dataset.p]=inp.value);
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const n=document.querySelector(`#entry input[data-i="${+inp.dataset.i+1}"]`);n?n.focus():saveRound()}});
  });
}
function setDraft(id,v){draft[id]=String(v);renderEntry()}
function bump(id,n){draft[id]=String((parseInt(draft[id],10)||0)+n);renderEntry()}
function renderBoard(){
  const max=Math.max(0,...S.players.map(p=>total(p.id)));
  const sorted=[...S.players].sort((a,b)=>total(b.id)-total(a.id));
  $("lb").innerHTML=sorted.length?sorted.map((p,i)=>{const t=total(p.id);return `<div class="pc ${t===max&&max>0?"lead":""}"><div class="n">${i===0&&max>0?"👑 ":""}${esc(p.name)}</div><div class="s">${t}</div><div class="bar"><i style="width:${Math.min(100,t/S.target*100)}%"></i></div><div class="muted">${Math.max(0,S.target-t)} to go</div></div>`}).join(""):'<div class="empty" style="grid-column:1/-1">Scores will appear here.</div>';
  const win=sorted.filter(p=>total(p.id)>=S.target);
  $("banner").innerHTML=win.length?`<div class="banner">🏆 ${esc(win[0].name)} wins with ${total(win[0].id)} points! (Target ${S.target})</div>`:"";
}
function renderTable(){
  if(!S.players.length){$("tbl").innerHTML='<tbody><tr><td class="empty">No players yet.</td></tr></tbody>';return}
  const head=`<thead><tr><th>Round</th>${S.players.map(p=>`<th>${esc(p.name)}</th>`).join("")}<th></th></tr></thead>`;
  const body=S.rounds.length?S.rounds.map((r,i)=>`<tr><td><strong>${i+1}</strong></td>${S.players.map(p=>`<td><input type="number" inputmode="numeric" value="${r.scores[p.id]??0}" onchange="editCell('${r.id}','${p.id}',this.value)"></td>`).join("")}<td><button class="sm dng" onclick="delRound('${r.id}')">Delete</button></td></tr>`).join(""):`<tr><td colspan="${S.players.length+2}" class="empty">No rounds yet — save your first round above.</td></tr>`;
  const foot=`<tfoot><tr><td>Total</td>${S.players.map(p=>`<td>${total(p.id)}</td>`).join("")}<td></td></tr></tfoot>`;
  $("tbl").innerHTML=head+`<tbody>${body}</tbody>`+foot;
}
function editCell(rid,pid,v){const r=S.rounds.find(x=>x.id===rid);const n=parseInt(v,10);r.scores[pid]=isNaN(n)?0:n;save();renderBoard();renderTable()}
function delRound(id){if(!confirm("Delete this round?"))return;S.rounds=S.rounds.filter(r=>r.id!==id);save();render()}
function render(){$("target").value=S.target;renderChips();renderEntry();renderBoard();renderTable()}

$("addBtn").onclick=addPlayer;
$("pname").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addPlayer()}});
$("save").onclick=saveRound;
$("clear").onclick=()=>{draft={};renderEntry()};
$("addRound").onclick=()=>{if(!S.players.length)return;const s={};S.players.forEach(p=>s[p.id]=0);S.rounds.push({id:uid(),scores:s});save();render()};
$("target").onchange=e=>{S.target=Math.max(1,parseInt(e.target.value,10)||200);save();render()};
$("newGame").onclick=()=>{if(confirm("Clear all rounds but keep players?")){S.rounds=[];draft={};save();render()}};
$("reset").onclick=()=>{if(confirm("Remove all players and scores?")){S={players:[],rounds:[],target:200};draft={};save();render()}};
load();render();
</script>
</body>
</html>
