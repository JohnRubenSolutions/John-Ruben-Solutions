<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flip 7 Multiplayer</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--text:#1c2030;--muted:#6b7288;--line:#e2e5ee;--accent:#e8590c;--accent2:#2f9e44;--danger:#e03131;--gold:#f59f00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1c2030;--text:#eceef6;--muted:#9aa2ba;--line:#2e3448;--accent:#ff8a3d;--accent2:#51cf66;--danger:#ff6b6b;--gold:#ffd43b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{margin:0;font-size:1.6rem}h1 span{color:var(--accent)}
h2{margin:0 0 10px;font-size:1.05rem}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:9px 13px}
button:hover{border-color:var(--accent)}
.pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.dng{color:var(--danger)}.sm{padding:5px 9px;font-size:.85rem}
.muted{color:var(--muted);font-size:.9rem}
.code{font-size:1.3rem;font-weight:800;letter-spacing:.15em;color:var(--accent)}
.err{color:var(--danger);margin-top:8px;min-height:1.2em}
.lb{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.pc.lead{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.pc.me{outline:2px solid var(--accent)}
.pc .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .s{font-size:2rem;font-weight:800;line-height:1.1}
.bar{height:6px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent2)}
.pe{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.pe.bust{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
.top{display:flex;justify-content:space-between;align-items:baseline}
.tot{font-size:1.8rem;font-weight:800;line-height:1}.pe.bust .tot{color:var(--danger)}
.tape{display:flex;flex-wrap:wrap;gap:5px;min-height:30px;margin:8px 0}
.tape button{padding:3px 9px;font-size:.9rem;border-radius:999px;background:var(--card)}
.tape .mod{border-color:var(--accent);color:var(--accent)}.tape .dup{border-color:var(--danger);color:var(--danger)}
.pad{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:5px;margin-bottom:6px}
.pad button{padding:8px 0;font-weight:700;background:var(--card)}
.tg.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.tg.bu.on{background:var(--danger);border-color:var(--danger)}
.ctl input{width:90px;text-align:center;font-weight:700}
.banner{background:var(--gold);color:#222;border-radius:12px;padding:12px 16px;margin-bottom:14px;font-weight:700}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:.85rem;font-weight:600}
th.rs,td.rs{cursor:pointer}
td input{width:70px;text-align:center;padding:6px}
tfoot td{font-weight:800;font-size:1.1rem;border-top:2px solid var(--line);border-bottom:0}
.empty{color:var(--muted);text-align:center;padding:18px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Flip <span>7</span> Multiplayer</h1>
  <div id="bar" class="row hide">
    <span class="muted">Game</span><span id="gcode" class="code"></span>
    <button id="copy" class="sm">Copy invite link</button>
    <button id="leave" class="sm dng">Leave</button>
  </div>
</header>

<section id="join" class="card hide">
  <h2>Join or start a game</h2>
  <div class="row">
    <input id="jname" placeholder="Your name" maxlength="24" style="flex:1;min-width:150px" autocomplete="off">
    <input id="jcode" placeholder="Game code" maxlength="5" style="width:130px;text-transform:uppercase" autocomplete="off">
    <button id="joinBtn" class="pri">Join game</button>
    <button id="createBtn">Create new game</button>
  </div>
  <div id="jerr" class="err"></div>
  <p class="muted">Create a game to become the host, then share the code. Everyone logs their own scores from their own device.</p>
</section>

<div id="game" class="hide">
  <div id="banner"></div>
  <section class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0">Your round <span id="rn" class="muted"></span></h2>
      <span id="note" class="muted"></span>
    </div>
    <div id="calc"></div>
    <div class="row" style="margin-top:10px"><button id="save" class="pri">Save my score</button></div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0">Scoreboard</h2>
      <div class="row">
        <label class="muted">Sort <select id="sort"></select></label>
        <span id="host" class="row hide">
          <label class="muted">Target <input id="target" type="number" min="1" style="width:80px"></label>
          <button id="next" class="sm pri">Next round ▶</button>
        </span>
      </div>
    </div>
    <div id="lb" class="lb"></div>
  </section>

  <section class="card">
    <h2>Round-by-round <span class="muted">(tap a round number to sort by it<span id="hh"></span>)</span></h2>
    <div class="scroll"><table id="tbl"></table></div>
  </section>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot,collection} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyDP6Vg2s5uPCrVV4vOK-PtogSdX0Dy21hw",
  authDomain:"flip-7-game.firebaseapp.com",
  projectId:"flip-7-game",
  storageBucket:"flip-7-game.firebasestorage.app",
  messagingSenderId:"1073060908266",
  appId:"1:1073060908266:web:4b5958cebc947efc575b93"
});
const auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sum=a=>a.reduce((x,y)=>x+y,0);
const LS="flip7-mp";
let me=null,code="",G=null,P=[],unsubs=[],sort="manual",lastRound=null;
let dr={c:[],m:[],x:0,f:0,b:0};
const calc=d=>d.b?0:sum(d.c)*(d.x?2:1)+sum(d.m)+(d.f?15:0);
const total=p=>sum(Object.values(p.rounds||{}).map(Number));
const isHost=()=>G&&G.hostUid===me;
const gref=()=>doc(db,"games",code);
const pref=id=>doc(db,"games",code,"players",id||me);
const show=(a,b)=>{$("join").classList.toggle("hide",a!=="join");$("game").classList.toggle("hide",a!=="game");$("bar").classList.toggle("hide",a!=="game")};
const err=m=>$("jerr").textContent=m||"";
const rand=()=>Array.from({length:5},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");

async function enter(c,name,create){
  err("");
  c=c.trim().toUpperCase();name=name.trim();
  if(!name){err("Enter your name.");return false}
  try{
    if(create){
      c=rand();
      await setDoc(doc(db,"games",c),{hostUid:me,target:200,round:1,createdAt:Date.now()});
    }else{
      if(!c){err("Enter a game code.");return false}
      const s=await getDoc(doc(db,"games",c));
      if(!s.exists()){err("No game found with that code.");return false}
    }
    code=c;
    await setDoc(pref(),{name,rounds:{},joinedAt:Date.now()},{merge:true});
    try{localStorage.setItem(LS,JSON.stringify({code,name}))}catch(e){}
    start();return true;
  }catch(e){err("Could not connect: "+(e.code||e.message));return false}
}
function start(){
  stop();show("game");
  $("gcode").textContent=code;G=null;P=[];lastRound=null;dr={c:[],m:[],x:0,f:0,b:0};
  unsubs.push(onSnapshot(gref(),s=>{
    if(!s.exists()){leave();err("That game was deleted.");return}
    G=s.data();
    if(lastRound!==G.round){lastRound=G.round;dr={c:[],m:[],x:0,f:0,b:0};renderCalc()}
    $("host").classList.toggle("hide",!isHost());$("hh").textContent=isHost()?"; you can edit any score as host":"";
    if(document.activeElement!==$("target"))$("target").value=G.target;
    renderAll();
  },e=>err(e.code||e.message)));
  unsubs.push(onSnapshot(collection(gref(),"players"),s=>{
    P=s.docs.map(d=>({id:d.id,...d.data()}));renderAll();
  }));
}
function stop(){unsubs.forEach(u=>u());unsubs=[]}
function leave(){
  stop();code="";G=null;P=[];
  try{localStorage.removeItem(LS)}catch(e){}
  show("join");
}

/* sorting */
function order(){
  const a=[...P],nm=(x,y)=>x.name.localeCompare(y.name,undefined,{sensitivity:"base"});
  if(sort==="name")a.sort(nm);
  else if(sort==="total")a.sort((x,y)=>total(y)-total(x)||nm(x,y));
  else if(sort.startsWith("r:")){const n=sort.slice(2);a.sort((x,y)=>(Number(y.rounds?.[n])||0)-(Number(x.rounds?.[n])||0)||nm(x,y))}
  else a.sort((x,y)=>(x.joinedAt||0)-(y.joinedAt||0));
  return a;
}
function renderSort(){
  const o=[["manual","Join order"],["name","Name A–Z"],["total","Total (high → low)"]];
  if(sort.startsWith("r:"))o.push([sort,"Round "+sort.slice(2)+" (high → low)"]);
  $("sort").innerHTML=o.map(([v,l])=>`<option value="${v}" ${sort===v?"selected":""}>${l}</option>`).join("");
}

/* calculator (this player only) */
function renderCalc(focus){
  const d=dr,hasDup=new Set(d.c).size!==d.c.length,empty=!d.c.length&&!d.m.length;
  const cards=d.c.map((n,i)=>`<button class="${d.c.indexOf(n)!==i?"dup":""}" title="Remove" onclick="rmCard(${i})">${n}${d.c.indexOf(n)!==i?" ⚠":""}</button>`).join("");
  const mods=d.m.map((n,i)=>`<button class="mod" title="Remove" onclick="rmMod(${i})">+${n}</button>`).join("");
  $("rn").textContent="— Round "+(G?G.round:1);
  $("calc").innerHTML=`<div class="pe ${d.b?"bust":""}">
    <div class="top"><span class="muted">Tap a card in the tape to remove it</span><span class="tot">${calc(d)}</span></div>
    <div class="tape">${d.b?'<span class="muted dng">BUST — scores 0</span>':empty?'<span class="muted">No cards yet</span>':""}${cards}${d.x?'<button class="mod" onclick="tog(\'x\')">×2</button>':""}${mods}${d.f?'<button class="mod" onclick="tog(\'f\')">Flip 7 +15</button>':""}</div>
    ${hasDup&&!d.b?'<div class="muted dng" style="margin-bottom:6px">Duplicate number — did you bust?</div>':""}
    <div class="pad">${Array.from({length:13},(_,n)=>`<button onclick="addCard(${n})">${n}</button>`).join("")}</div>
    <div class="row ctl">
      <input id="cin" type="number" inputmode="numeric" min="0" placeholder="Card #">
      <button class="sm pri" onclick="addCard($('cin').value,true)">Add</button>
      <button class="sm tg ${d.x?"on":""}" onclick="tog('x')">×2</button>
      ${[2,4,6,8,10].map(n=>`<button class="sm" onclick="addMod(${n})">+${n}</button>`).join("")}
      <button class="sm tg ${d.f?"on":""}" onclick="tog('f')">Flip 7 +15</button>
      <button class="sm tg bu ${d.b?"on":""}" onclick="tog('b')">${d.b?"Busted ✓":"Bust"}</button>
      <button class="sm" onclick="undo()">Undo</button>
      <button class="sm" onclick="clr()">Clear</button>
    </div></div>`;
  $("cin").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addCard($("cin").value,true)}});
  if(focus)$("cin").focus();
}
const upd=f=>{renderCalc(f)};
window.addCard=(v,f)=>{const n=parseInt(v,10);if(isNaN(n)||n<0)return;dr.c.push(n);upd(f)};
window.rmCard=i=>{dr.c.splice(i,1);upd()};
window.addMod=n=>{dr.m.push(n);upd()};
window.rmMod=i=>{dr.m.splice(i,1);upd()};
window.tog=k=>{dr[k]=dr[k]?0:1;upd()};
window.undo=()=>{if(dr.m.length&&!dr.c.length)dr.m.pop();else dr.c.pop();upd()};
window.clr=()=>{dr={c:[],m:[],x:0,f:0,b:0};upd()};
window.sortRound=n=>{sort=sort==="r:"+n?"manual":"r:"+n;renderAll()};
window.editCell=async(id,n,v)=>{const x=parseInt(v,10);try{await updateDoc(pref(id),{["rounds."+n]:isNaN(x)?0:x})}catch(e){alert("Could not save: "+(e.code||e.message))}};
window.kick=async id=>{if(confirm("Remove this player from the game?"))try{await deleteDoc(pref(id))}catch(e){alert(e.code||e.message)}};

async function saveMine(){
  if(!G)return;
  try{await updateDoc(pref(),{["rounds."+G.round]:calc(dr)});
    dr={c:[],m:[],x:0,f:0,b:0};renderCalc()}
  catch(e){alert("Could not save: "+(e.code||e.message))}
}

/* boards */
function renderAll(){renderSort();renderBoard();renderTable()}
function renderBoard(){
  if(!G)return;
  const ps=order(),max=Math.max(0,...P.map(total)),r=G.round;
  const mine=P.find(p=>p.id===me),done=mine&&mine.rounds&&mine.rounds[r]!==undefined;
  $("note").textContent=done?"✓ Saved for this round: "+mine.rounds[r]+" (save again to overwrite)":"Not saved yet this round";
  $("lb").innerHTML=ps.length?ps.map(p=>{const t=total(p),sv=p.rounds&&p.rounds[r]!==undefined;
    return `<div class="pc ${t===max&&max>0?"lead":""} ${p.id===me?"me":""}"><div class="n">${t===max&&max>0?"👑 ":""}${esc(p.name)}${p.id===G.hostUid?" ★":""}</div><div class="s">${t}</div><div class="bar"><i style="width:${Math.min(100,t/G.target*100)}%"></i></div><div class="muted">${Math.max(0,G.target-t)} to go · ${sv?"✓ in":"…"}${isHost()&&p.id!==me?` <button class="sm dng" onclick="kick('${p.id}')">✕</button>`:""}</div></div>`}).join(""):'<div class="empty" style="grid-column:1/-1">Waiting for players…</div>';
  const w=[...P].sort((a,b)=>total(b)-total(a))[0];
  $("banner").innerHTML=w&&total(w)>=G.target?`<div class="banner">🏆 ${esc(w.name)} wins with ${total(w)} points! (Target ${G.target})</div>`:"";
}
function renderTable(){
  if(!G||!P.length){$("tbl").innerHTML='<tbody><tr><td class="empty">No players yet.</td></tr></tbody>';return}
  const ps=order(),h=isHost();
  const head=`<thead><tr><th>Round</th>${ps.map(p=>`<th>${esc(p.name)}</th>`).join("")}</tr></thead>`;
  let body="";
  for(let n=1;n<=G.round;n++)body+=`<tr><td class="rs" onclick="sortRound(${n})"><strong>${n}${sort==="r:"+n?" ↓":""}</strong></td>${ps.map(p=>{const v=p.rounds?.[n];return `<td>${h?`<input type="number" inputmode="numeric" value="${v??""}" placeholder="–" onchange="editCell('${p.id}',${n},this.value)">`:(v??"–")}</td>`}).join("")}</tr>`;
  $("tbl").innerHTML=head+`<tbody>${body}</tbody><tfoot><tr><td>Total</td>${ps.map(p=>`<td>${total(p)}</td>`).join("")}</tr></tfoot>`;
}

/* wiring */
$("joinBtn").onclick=()=>enter($("jcode").value,$("jname").value,false);
$("createBtn").onclick=()=>enter("",$("jname").value,true);
$("save").onclick=saveMine;
$("sort").onchange=e=>{sort=e.target.value;renderAll()};
$("leave").onclick=()=>{if(confirm("Leave this game? You can rejoin with the code."))leave()};
$("copy").onclick=async()=>{
  const u=location.origin+location.pathname+"?game="+code;
  try{await navigator.clipboard.writeText(u);$("copy").textContent="Copied ✓"}catch(e){prompt("Invite link",u)}
  setTimeout(()=>$("copy").textContent="Copy invite link",1500);
};
$("next").onclick=async()=>{if(confirm("Start round "+(G.round+1)+" for everyone?"))try{await updateDoc(gref(),{round:G.round+1})}catch(e){alert(e.code||e.message)}};
$("target").onchange=async e=>{try{await updateDoc(gref(),{target:Math.max(1,parseInt(e.target.value,10)||200)})}catch(x){alert(x.code||x.message)}};
for(const id of["jname","jcode"])$(id).addEventListener("keydown",e=>{if(e.key==="Enter")$("joinBtn").click()});

(async()=>{
  show("join");
  let saved={};try{saved=JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){}
  const q=new URLSearchParams(location.search).get("game");
  $("jname").value=saved.name||"";$("jcode").value=(q||saved.code||"").toUpperCase();
  try{me=(await signInAnonymously(auth)).user.uid}
  catch(e){err("Sign-in failed ("+(e.code||e.message)+"). Enable Anonymous sign-in in Firebase Authentication.");return}
  if(saved.code&&saved.name&&(!q||q.toUpperCase()===saved.code))await enter(saved.code,saved.name,false);
})();
</script>
</body>
</html>
